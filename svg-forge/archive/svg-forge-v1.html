<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVG Forge — offline logo &amp; icon maker</title>
<style>
  :root{
    --bg:#0a0e0f; --panel:#11161a; --panel2:#0c1113; --line:#1e2a2e;
    --text:#b8c9c2; --dim:#6b827a; --bright:#e8fff4;
    --cyan:#22d3ee; --green:#4ade80;
    --mono: ui-monospace,"DejaVu Sans Mono","SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--text); font-family:var(--mono);
    font-size:13px; display:flex; flex-direction:column; overflow:hidden;
  }
  .glow{text-shadow:0 0 6px rgba(34,211,238,.45)}
  h1,h2,.eyebrow{font-family:var(--mono); letter-spacing:.18em; text-transform:uppercase}
  /* ---- top bar ---- */
  header{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    padding:8px 12px; border-bottom:1px solid var(--line); background:var(--panel2);
  }
  .brand{font-size:14px; font-weight:bold; color:var(--bright); letter-spacing:.22em}
  .brand b{background:linear-gradient(120deg,var(--cyan),var(--green));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent}
  .bar-group{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
  .sep{width:1px; height:22px; background:var(--line)}
  label.lbl{color:var(--dim); font-size:11px; letter-spacing:.12em; text-transform:uppercase}
  button, select, input{
    font-family:var(--mono); font-size:12px; color:var(--text);
    background:var(--panel); border:1px solid var(--line); border-radius:5px;
    padding:5px 9px; cursor:pointer; transition:border-color .12s, color .12s;
  }
  button:hover, select:hover{border-color:var(--cyan); color:var(--bright)}
  button:active{transform:translateY(1px)}
  button.primary{border-color:#244; color:var(--cyan)}
  button.primary:hover{border-color:var(--cyan); box-shadow:0 0 10px rgba(34,211,238,.25)}
  input{cursor:text}
  input[type=number]{width:62px}
  input[type=color]{padding:2px; width:34px; height:28px; cursor:pointer}
  input[type=checkbox]{width:14px;height:14px;accent-color:var(--green);cursor:pointer}
  input:focus, select:focus, button:focus-visible{outline:2px solid var(--cyan); outline-offset:1px}
  /* ---- layout ---- */
  main{flex:1; display:grid; grid-template-columns:200px 1fr 248px; min-height:0}
  .col{overflow-y:auto; padding:12px}
  .col.left{border-right:1px solid var(--line); background:var(--panel2)}
  .col.right{border-left:1px solid var(--line); background:var(--panel2)}
  .stage-wrap{
    display:flex; align-items:center; justify-content:center; overflow:auto; padding:24px;
    background:
      radial-gradient(circle at 50% 0%, rgba(34,211,238,.05), transparent 60%),
      var(--bg);
  }
  .stage-canvas{
    --c1:#13191b; --c2:#0d1113;
    background-color:var(--c2);
    background-image:
      linear-gradient(45deg,var(--c1) 25%,transparent 25%),
      linear-gradient(-45deg,var(--c1) 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,var(--c1) 75%),
      linear-gradient(-45deg,transparent 75%,var(--c1) 75%);
    background-size:16px 16px;
    background-position:0 0,0 8px,8px -8px,-8px 0;
    box-shadow:0 0 0 1px var(--line), 0 12px 40px rgba(0,0,0,.5);
    line-height:0;
  }
  svg#stage{display:block; touch-action:none}
  .panel-title{color:var(--cyan); font-size:11px; margin:0 0 10px; letter-spacing:.2em}
  .field{display:flex; align-items:center; justify-content:space-between; gap:8px; margin:7px 0}
  .field > label{color:var(--dim); font-size:11px; white-space:nowrap}
  .field input[type=text]{width:100%}
  .row2{display:flex; gap:6px}
  .row2 input{width:100%}
  .hint{color:var(--dim); font-size:11px; line-height:1.5; margin:6px 0 0}
  /* layers */
  .layer{
    display:flex; align-items:center; gap:6px; padding:6px 7px; margin:3px 0;
    border:1px solid transparent; border-radius:5px; cursor:pointer; background:var(--panel);
  }
  .layer:hover{border-color:var(--line)}
  .layer.sel{border-color:var(--cyan); color:var(--bright); box-shadow:inset 0 0 0 1px rgba(34,211,238,.2)}
  .layer .tag{font-size:10px; color:var(--dim); text-transform:uppercase; letter-spacing:.1em}
  .layer .nm{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .layer-actions{display:flex; gap:4px; margin-top:8px}
  .layer-actions button{flex:1; padding:5px 0; font-size:11px}
  .add-grid{display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:6px}
  .add-grid button{padding:8px 4px}
  .empty{color:var(--dim); font-size:11px; padding:10px 4px}
  .swatch-row{display:flex;align-items:center;gap:6px}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#1c2629;border-radius:6px}
  ::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<header>
  <span class="brand">SVG&nbsp;<b>FORGE</b></span>
  <div class="sep"></div>

  <div class="bar-group">
    <label class="lbl">Canvas</label>
    <select id="presetSel" title="Canvas size preset">
      <option value="190x64">190 × 64  (GDM logo)</option>
      <option value="380x128">380 × 128</option>
      <option value="759x256">759 × 256</option>
      <option value="64x64">64 × 64  (icon)</option>
      <option value="128x128">128 × 128</option>
      <option value="256x256">256 × 256</option>
      <option value="512x512">512 × 512</option>
      <option value="custom">custom…</option>
    </select>
    <input type="number" id="cw" min="1" max="8000" value="190" title="Canvas width">
    <input type="number" id="ch" min="1" max="8000" value="64" title="Canvas height">
  </div>

  <div class="sep"></div>
  <div class="bar-group">
    <label class="lbl">Zoom</label>
    <button id="zoomOut" title="Zoom out">−</button>
    <span id="zoomVal" style="min-width:42px;text-align:center;color:var(--dim)">100%</span>
    <button id="zoomIn" title="Zoom in">+</button>
    <button id="zoomFit" title="Fit to view">fit</button>
    <label class="lbl" style="margin-left:6px"><input type="checkbox" id="gridChk"> grid</label>
  </div>

  <div class="sep"></div>
  <div class="bar-group">
    <button id="fontBtn" title="Upload a .ttf / .otf / .woff font">↑ font</button>
    <input type="file" id="fontInput" accept=".ttf,.otf,.woff,.woff2,font/*" hidden>
    <button id="saveBtn" title="Save project (.json)">save</button>
    <button id="loadBtn" title="Load project (.json)">load</button>
    <input type="file" id="loadInput" accept=".json,application/json" hidden>
  </div>

  <div class="sep"></div>
  <div class="bar-group">
    <button class="primary" id="exportSvg">⤓ SVG</button>
    <label class="lbl">PNG&nbsp;×</label>
    <select id="pngScale" title="PNG export scale">
      <option value="1">1×</option>
      <option value="2">2×</option>
      <option value="4" selected>4×</option>
      <option value="8">8×</option>
    </select>
    <button class="primary" id="exportPng">⤓ PNG</button>
  </div>
</header>

<main>
  <!-- LEFT: add + layers -->
  <section class="col left">
    <h2 class="panel-title">Add element</h2>
    <div class="add-grid">
      <button data-add="rect">▭ Rect</button>
      <button data-add="ellipse">◯ Ellipse</button>
      <button data-add="triangle">△ Triangle</button>
      <button data-add="hexagon">⬡ Hexagon</button>
      <button data-add="star">★ Star</button>
      <button data-add="text">T Text</button>
    </div>
    <button data-add="line" style="width:100%">— Line</button>

    <h2 class="panel-title" style="margin-top:20px">Layers</h2>
    <div id="layers"></div>
    <div class="layer-actions">
      <button id="dupBtn" title="Duplicate">dup</button>
      <button id="upBtn" title="Bring forward">↑</button>
      <button id="downBtn" title="Send back">↓</button>
      <button id="delBtn" title="Delete">del</button>
    </div>
    <p class="hint">Drag on canvas to move. Arrow keys nudge (Shift = ×10). Delete removes the selection.</p>
  </section>

  <!-- CENTER: stage -->
  <section class="stage-wrap" id="stageWrap">
    <div class="stage-canvas" id="stageCanvas">
      <svg id="stage" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </section>

  <!-- RIGHT: properties -->
  <section class="col right">
    <h2 class="panel-title">Properties</h2>
    <div id="props"><div class="empty">Nothing selected. Add an element or pick a layer.</div></div>
  </section>
</main>

<script>
"use strict";
(function(){
  // ---------- state ----------
  const NS = "http://www.w3.org/2000/svg";
  const state = {
    canvas:{w:190,h:64},
    objects:[],
    selectedId:null,
    fonts:[],          // {name, dataUrl}
    nextId:1,
    zoom:3,
    grid:false,
  };

  const $ = id => document.getElementById(id);
  const stage = $("stage");
  const stageCanvas = $("stageCanvas");
  const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
  const uid = ()=> state.nextId++;

  // ---------- defaults ----------
  function defaultObject(type){
    const c = state.canvas;
    const base = {
      id: uid(), type,
      x: Math.round(c.w*0.30), y: Math.round(c.h*0.30),
      w: Math.round(Math.min(c.w,c.h)*0.4), h: Math.round(Math.min(c.w,c.h)*0.4),
      rotation:0, opacity:1,
      fillMode:"solid",            // solid | gradient | none
      fill:"#22d3ee",
      grad:["#22d3ee","#4ade80"], gradAngle:135,
      stroke:"#000000", strokeWidth:0,
      glow:false, glowStrength:1.1,
    };
    if(type==="rect"){ base.rx=0; }
    if(type==="line"){
      base.fillMode="none"; base.stroke="#22d3ee"; base.strokeWidth=3;
      base.w=Math.round(c.w*0.4); base.h=0;
    }
    if(type==="text"){
      base.text="watcher"; base.fontFamily="__mono"; base.fontSize=Math.round(c.h*0.4);
      base.fontWeight="bold"; base.letterSpacing=0;
      base.fillMode="gradient";
      base.x=Math.round(c.w*0.2); base.y=Math.round(c.h*0.6);
    }
    return base;
  }

  function addObject(type){
    const o = defaultObject(type);
    state.objects.push(o);
    state.selectedId = o.id;
    fullRender();
  }
  function getSel(){ return state.objects.find(o=>o.id===state.selectedId) || null; }

  // ---------- geometry ----------
  // polygon points in actual coords, fitted to bbox
  function polyPoints(type,o){
    const {x,y,w,h}=o;
    const map = pts => pts.map(p=>`${(x+p[0]*w).toFixed(2)},${(y+p[1]*h).toFixed(2)}`).join(" ");
    if(type==="triangle") return map([[0.5,0],[1,1],[0,1]]);
    if(type==="hexagon")  return map([[0.5,0],[1,0.25],[1,0.75],[0.5,1],[0,0.75],[0,0.25]]);
    if(type==="star"){
      const pts=[]; const cx=0.5,cy=0.5,oR=0.5,iR=0.22;
      for(let i=0;i<10;i++){
        const r=(i%2===0)?oR:iR;
        const a=(-90 + i*36)*Math.PI/180;
        pts.push([cx+r*Math.cos(a), cy+r*Math.sin(a)]);
      }
      return map(pts);
    }
    return "";
  }

  // returns {x,y,w,h} bbox in user units for selection overlay
  function bboxOf(o){
    if(o.type==="text"){
      const el = stage.querySelector(`[data-id="${o.id}"]`);
      if(el){ try{ const b=el.getBBox(); return {x:b.x,y:b.y,w:b.width,h:b.height}; }catch(e){} }
      return {x:o.x, y:o.y-o.fontSize, w:o.fontSize*4, h:o.fontSize};
    }
    if(o.type==="line"){
      return {x:Math.min(o.x,o.x+o.w), y:Math.min(o.y,o.y+o.h),
              w:Math.abs(o.w)||1, h:Math.abs(o.h)||1};
    }
    return {x:o.x, y:o.y, w:o.w, h:o.h};
  }

  // ---------- rendering ----------
  function fontFamilyValue(o){
    if(o.fontFamily==="__mono") return "ui-monospace, monospace";
    if(o.fontFamily==="__sans") return "system-ui, sans-serif";
    if(o.fontFamily==="__serif") return "Georgia, serif";
    return `'${o.fontFamily}'`;
  }

  function makeDefsFor(o, defs){
    if(o.fillMode==="gradient"){
      const g=document.createElementNS(NS,"linearGradient");
      g.setAttribute("id",`grad_${o.id}`);
      const a=o.gradAngle*Math.PI/180;
      const x1=(0.5-Math.cos(a)*0.5).toFixed(4), y1=(0.5-Math.sin(a)*0.5).toFixed(4);
      const x2=(0.5+Math.cos(a)*0.5).toFixed(4), y2=(0.5+Math.sin(a)*0.5).toFixed(4);
      g.setAttribute("x1",x1); g.setAttribute("y1",y1);
      g.setAttribute("x2",x2); g.setAttribute("y2",y2);
      [0,1].forEach(i=>{
        const s=document.createElementNS(NS,"stop");
        s.setAttribute("offset",i); s.setAttribute("stop-color",o.grad[i]);
        g.appendChild(s);
      });
      defs.appendChild(g);
    }
    if(o.glow){
      const f=document.createElementNS(NS,"filter");
      f.setAttribute("id",`glow_${o.id}`);
      f.setAttribute("x","-50%");f.setAttribute("y","-50%");
      f.setAttribute("width","200%");f.setAttribute("height","200%");
      const b=document.createElementNS(NS,"feGaussianBlur");
      b.setAttribute("stdDeviation",o.glowStrength); b.setAttribute("result","b");
      const m=document.createElementNS(NS,"feMerge");
      ["b","SourceGraphic"].forEach(n=>{
        const mn=document.createElementNS(NS,"feMergeNode"); mn.setAttribute("in",n); m.appendChild(mn);
      });
      f.appendChild(b); f.appendChild(m); defs.appendChild(f);
    }
  }

  function paint(o){ // returns fill value
    if(o.fillMode==="none") return "none";
    if(o.fillMode==="gradient") return `url(#grad_${o.id})`;
    return o.fill;
  }

  function makeElement(o){
    let el;
    if(o.type==="rect"){
      el=document.createElementNS(NS,"rect");
      el.setAttribute("x",o.x);el.setAttribute("y",o.y);
      el.setAttribute("width",Math.max(0,o.w));el.setAttribute("height",Math.max(0,o.h));
      if(o.rx) el.setAttribute("rx",o.rx);
    } else if(o.type==="ellipse"){
      el=document.createElementNS(NS,"ellipse");
      el.setAttribute("cx",o.x+o.w/2);el.setAttribute("cy",o.y+o.h/2);
      el.setAttribute("rx",Math.max(0,o.w/2));el.setAttribute("ry",Math.max(0,o.h/2));
    } else if(o.type==="line"){
      el=document.createElementNS(NS,"line");
      el.setAttribute("x1",o.x);el.setAttribute("y1",o.y);
      el.setAttribute("x2",o.x+o.w);el.setAttribute("y2",o.y+o.h);
      el.setAttribute("stroke-linecap","round");
    } else if(o.type==="text"){
      el=document.createElementNS(NS,"text");
      el.setAttribute("x",o.x);el.setAttribute("y",o.y);
      el.setAttribute("font-family",fontFamilyValue(o));
      el.setAttribute("font-size",o.fontSize);
      el.setAttribute("font-weight",o.fontWeight);
      if(o.letterSpacing) el.setAttribute("letter-spacing",o.letterSpacing);
      el.textContent=o.text;
    } else { // polygon shapes
      el=document.createElementNS(NS,"polygon");
      el.setAttribute("points",polyPoints(o.type,o));
    }
    // common paint
    el.setAttribute("fill", o.type==="line" ? "none" : paint(o));
    if(o.strokeWidth>0 || o.type==="line"){
      el.setAttribute("stroke", o.fillMode==="gradient" && o.type==="line" ? `url(#grad_${o.id})` : o.stroke);
      el.setAttribute("stroke-width", o.strokeWidth || (o.type==="line"?3:0));
      el.setAttribute("stroke-linejoin","round");
    }
    if(o.opacity!==1) el.setAttribute("opacity",o.opacity);
    if(o.glow) el.setAttribute("filter",`url(#glow_${o.id})`);
    if(o.rotation){
      const b=(o.type==="text")?{x:o.x,y:o.y,w:0,h:0}:{x:o.x,y:o.y,w:o.w,h:o.h};
      const cx=b.x+b.w/2, cy=b.y+b.h/2;
      el.setAttribute("transform",`rotate(${o.rotation} ${cx} ${cy})`);
    }
    el.setAttribute("data-id",o.id);
    el.setAttribute("pointer-events","all");
    return el;
  }

  function applyZoom(){
    const z=state.zoom;
    stage.style.width=(state.canvas.w*z)+"px";
    stage.style.height=(state.canvas.h*z)+"px";
    stage.setAttribute("viewBox",`0 0 ${state.canvas.w} ${state.canvas.h}`);
    $("zoomVal").textContent=Math.round(z*100)+"%";
  }

  function drawGrid(){
    if(!state.grid) return;
    const g=document.createElementNS(NS,"g");
    g.setAttribute("pointer-events","none");
    const step = Math.max(8, Math.round(Math.min(state.canvas.w,state.canvas.h)/8));
    const mk=(x1,y1,x2,y2)=>{const l=document.createElementNS(NS,"line");
      l.setAttribute("x1",x1);l.setAttribute("y1",y1);l.setAttribute("x2",x2);l.setAttribute("y2",y2);
      l.setAttribute("stroke","#22d3ee");l.setAttribute("stroke-width",0.4/state.zoom);
      l.setAttribute("opacity",0.18);g.appendChild(l);};
    for(let x=step;x<state.canvas.w;x+=step) mk(x,0,x,state.canvas.h);
    for(let y=step;y<state.canvas.h;y+=step) mk(0,y,state.canvas.w,y);
    stage.appendChild(g);
  }

  function drawOverlay(){
    const o=getSel(); if(!o) return;
    const b=bboxOf(o);
    const s=1/state.zoom;
    const g=document.createElementNS(NS,"g"); g.setAttribute("pointer-events","none");
    if(o.rotation){
      const cx=b.x+b.w/2, cy=b.y+b.h/2;
      g.setAttribute("transform",`rotate(${o.rotation} ${cx} ${cy})`);
    }
    const box=document.createElementNS(NS,"rect");
    box.setAttribute("x",b.x);box.setAttribute("y",b.y);
    box.setAttribute("width",b.w);box.setAttribute("height",b.h);
    box.setAttribute("fill","none");box.setAttribute("stroke","#22d3ee");
    box.setAttribute("stroke-width",1*s);box.setAttribute("stroke-dasharray",`${4*s} ${3*s}`);
    g.appendChild(box);
    // resize handles only when not rotated and shape is bbox-based
    const resizable = o.rotation===0 && o.type!=="text" && o.type!=="line";
    if(resizable){
      const hs=7*s;
      const corners={nw:[b.x,b.y],ne:[b.x+b.w,b.y],sw:[b.x,b.y+b.h],se:[b.x+b.w,b.y+b.h]};
      for(const k in corners){
        const [hx,hy]=corners[k];
        const r=document.createElementNS(NS,"rect");
        r.setAttribute("x",hx-hs/2);r.setAttribute("y",hy-hs/2);
        r.setAttribute("width",hs);r.setAttribute("height",hs);
        r.setAttribute("fill","#0a0e0f");r.setAttribute("stroke","#22d3ee");
        r.setAttribute("stroke-width",1*s);
        r.setAttribute("data-handle",k);r.setAttribute("pointer-events","all");
        r.style.cursor=(k==="nw"||k==="se")?"nwse-resize":"nesw-resize";
        g.appendChild(r);
      }
    }
    stage.appendChild(g);
  }

  function fullRender(){
    applyZoom();
    stage.innerHTML="";
    // empty-click catcher
    const bg=document.createElementNS(NS,"rect");
    bg.setAttribute("x",0);bg.setAttribute("y",0);
    bg.setAttribute("width",state.canvas.w);bg.setAttribute("height",state.canvas.h);
    bg.setAttribute("fill","transparent");bg.setAttribute("data-empty","1");
    bg.setAttribute("pointer-events","all");
    stage.appendChild(bg);

    const defs=document.createElementNS(NS,"defs");
    stage.appendChild(defs);
    for(const o of state.objects){
      makeDefsFor(o,defs);
      stage.appendChild(makeElement(o));
    }
    drawGrid();
    drawOverlay();
    renderLayers();
    syncPanel();
  }

  // ---------- layers ----------
  function renderLayers(){
    const box=$("layers"); box.innerHTML="";
    if(state.objects.length===0){ box.innerHTML='<div class="empty">No elements yet.</div>'; return; }
    // front first (reverse draw order)
    [...state.objects].reverse().forEach(o=>{
      const d=document.createElement("div");
      d.className="layer"+(o.id===state.selectedId?" sel":"");
      const name=o.type==="text"?`"${o.text}"`:o.type;
      d.innerHTML=`<span class="tag">${o.type[0]}</span><span class="nm">${escapeHtml(name)}</span>`;
      d.addEventListener("click",()=>{ state.selectedId=o.id; fullRender(); });
      box.appendChild(d);
    });
  }
  function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

  // ---------- properties panel ----------
  let panelKey="";
  function syncPanel(){
    const o=getSel();
    const key = o ? o.id+":"+o.type : "none";
    if(key!==panelKey){ buildPanel(); panelKey=key; }
    else refreshPanel();
  }

  function field(label, inputHtml){
    return `<div class="field"><label>${label}</label>${inputHtml}</div>`;
  }
  function buildPanel(){
    const host=$("props"); const o=getSel();
    if(!o){ host.innerHTML='<div class="empty">Nothing selected. Add an element or pick a layer.</div>'; return; }
    let h="";
    h+=field("X",`<input type="number" data-k="x" step="1">`);
    h+=field("Y",`<input type="number" data-k="y" step="1">`);
    if(o.type!=="text"){
      h+=field(o.type==="line"?"ΔX":"W",`<input type="number" data-k="w" step="1">`);
      h+=field(o.type==="line"?"ΔY":"H",`<input type="number" data-k="h" step="1">`);
    }
    h+=field("Rotate",`<input type="number" data-k="rotation" step="1">`);
    h+=field("Opacity",`<input type="number" data-k="opacity" min="0" max="1" step="0.05">`);
    if(o.type==="rect") h+=field("Corner",`<input type="number" data-k="rx" min="0" step="1">`);

    if(o.type==="text"){
      h+=field("Text",`<input type="text" data-k="text">`);
      const fontOpts=`<option value="__mono">Mono (system)</option>`+
        `<option value="__sans">Sans (system)</option>`+
        `<option value="__serif">Serif (system)</option>`+
        state.fonts.map(f=>`<option value="${escapeHtml(f.name)}">${escapeHtml(f.name)}</option>`).join("");
      h+=field("Font",`<select data-k="fontFamily">${fontOpts}</select>`);
      h+=field("Size",`<input type="number" data-k="fontSize" min="1" step="1">`);
      h+=field("Weight",`<select data-k="fontWeight"><option value="normal">normal</option><option value="bold">bold</option></select>`);
      h+=field("Spacing",`<input type="number" data-k="letterSpacing" step="0.5">`);
    }

    h+=`<div class="sep" style="height:1px;width:100%;margin:12px 0"></div>`;
    h+=field("Fill",`<select data-k="fillMode"><option value="solid">solid</option><option value="gradient">gradient</option><option value="none">none</option></select>`);
    h+=`<div data-grp="solid">`+field("Color",`<input type="color" data-k="fill">`)+`</div>`;
    h+=`<div data-grp="gradient">`+
        field("From",`<input type="color" data-k="grad0">`)+
        field("To",`<input type="color" data-k="grad1">`)+
        field("Angle",`<input type="number" data-k="gradAngle" step="5">`)+
       `</div>`;
    h+=`<div class="sep" style="height:1px;width:100%;margin:12px 0"></div>`;
    h+=field("Stroke",`<input type="color" data-k="stroke">`);
    h+=field("Stroke W",`<input type="number" data-k="strokeWidth" min="0" step="0.5">`);
    h+=field("Glow",`<input type="checkbox" data-k="glow">`);
    h+=field("Glow str",`<input type="number" data-k="glowStrength" min="0" step="0.1">`);

    host.innerHTML=h;
    host.querySelectorAll("[data-k]").forEach(inp=>{
      const ev = (inp.type==="checkbox"||inp.tagName==="SELECT")?"change":"input";
      inp.addEventListener(ev,onPanelInput);
    });
    refreshPanel();
  }

  function refreshPanel(){
    const o=getSel(); if(!o) return;
    const host=$("props");
    host.querySelectorAll("[data-k]").forEach(inp=>{
      const k=inp.dataset.k;
      let v;
      if(k==="grad0") v=o.grad[0];
      else if(k==="grad1") v=o.grad[1];
      else v=o[k];
      if(inp.type==="checkbox") inp.checked=!!v;
      else if(v!==undefined && document.activeElement!==inp) inp.value=v;
    });
    const gs=host.querySelector('[data-grp="solid"]'),
          gg=host.querySelector('[data-grp="gradient"]');
    if(gs) gs.style.display=(o.fillMode==="solid")?"":"none";
    if(gg) gg.style.display=(o.fillMode==="gradient")?"":"none";
  }

  function onPanelInput(e){
    const o=getSel(); if(!o) return;
    const inp=e.target, k=inp.dataset.k;
    let v = inp.type==="checkbox" ? inp.checked
          : inp.type==="number" ? parseFloat(inp.value)
          : inp.value;
    if(inp.type==="number" && Number.isNaN(v)) return;
    if(k==="grad0"){ o.grad[0]=v; }
    else if(k==="grad1"){ o.grad[1]=v; }
    else { o[k]=v; }
    fullRender();
  }

  // ---------- pointer interaction ----------
  let drag=null;
  function toUser(e){
    const m=stage.getScreenCTM().inverse();
    const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(m);
    return {x:p.x,y:p.y};
  }
  stage.addEventListener("pointerdown",e=>{
    const t=e.target;
    if(t.dataset.handle){
      const o=getSel(); if(!o) return;
      drag={mode:"resize",handle:t.dataset.handle,start:toUser(e),
            orig:{x:o.x,y:o.y,w:o.w,h:o.h}};
      stage.setPointerCapture(e.pointerId); e.preventDefault(); return;
    }
    if(t.dataset.id){
      state.selectedId=parseInt(t.dataset.id,10);
      const o=getSel();
      drag={mode:"move",start:toUser(e),orig:{x:o.x,y:o.y}};
      fullRender();
      stage.setPointerCapture(e.pointerId); e.preventDefault(); return;
    }
    if(t.dataset.empty){ state.selectedId=null; fullRender(); }
  });
  stage.addEventListener("pointermove",e=>{
    if(!drag) return;
    const o=getSel(); if(!o){ drag=null; return; }
    const p=toUser(e);
    const dx=p.x-drag.start.x, dy=p.y-drag.start.y;
    if(drag.mode==="move"){
      o.x=Math.round(drag.orig.x+dx); o.y=Math.round(drag.orig.y+dy);
    } else {
      const g=drag.orig, h=drag.handle;
      let nx=g.x, ny=g.y, nw=g.w, nh=g.h;
      if(h.includes("e")) nw=g.w+dx;
      if(h.includes("s")) nh=g.h+dy;
      if(h.includes("w")){ nw=g.w-dx; nx=g.x+dx; }
      if(h.includes("n")){ nh=g.h-dy; ny=g.y+dy; }
      if(nw<1){ nw=1; if(h.includes("w")) nx=g.x+g.w-1; }
      if(nh<1){ nh=1; if(h.includes("n")) ny=g.y+g.h-1; }
      o.x=Math.round(nx);o.y=Math.round(ny);o.w=Math.round(nw);o.h=Math.round(nh);
    }
    fullRender();
  });
  const endDrag=()=>{ drag=null; };
  stage.addEventListener("pointerup",endDrag);
  stage.addEventListener("pointercancel",endDrag);

  // ---------- keyboard ----------
  document.addEventListener("keydown",e=>{
    const tag=document.activeElement && document.activeElement.tagName;
    if(tag==="INPUT"||tag==="SELECT"||tag==="TEXTAREA") return;
    const o=getSel(); if(!o) return;
    if(e.key==="Delete"||e.key==="Backspace"){ deleteSel(); e.preventDefault(); return; }
    const step=e.shiftKey?10:1;
    if(e.key==="ArrowLeft"){o.x-=step;fullRender();e.preventDefault();}
    if(e.key==="ArrowRight"){o.x+=step;fullRender();e.preventDefault();}
    if(e.key==="ArrowUp"){o.y-=step;fullRender();e.preventDefault();}
    if(e.key==="ArrowDown"){o.y+=step;fullRender();e.preventDefault();}
  });

  // ---------- layer ops ----------
  function deleteSel(){
    const i=state.objects.findIndex(o=>o.id===state.selectedId);
    if(i<0) return;
    state.objects.splice(i,1);
    state.selectedId = state.objects.length ? state.objects[Math.max(0,i-1)].id : null;
    fullRender();
  }
  function duplicateSel(){
    const o=getSel(); if(!o) return;
    const c=JSON.parse(JSON.stringify(o));
    c.id=uid(); c.x+=6; c.y+=6;
    const i=state.objects.findIndex(x=>x.id===o.id);
    state.objects.splice(i+1,0,c); state.selectedId=c.id; fullRender();
  }
  function move(dir){
    const i=state.objects.findIndex(o=>o.id===state.selectedId);
    if(i<0) return;
    const j=i+dir;
    if(j<0||j>=state.objects.length) return;
    [state.objects[i],state.objects[j]]=[state.objects[j],state.objects[i]];
    fullRender();
  }
  $("delBtn").onclick=deleteSel;
  $("dupBtn").onclick=duplicateSel;
  $("upBtn").onclick=()=>move(1);    // later in array = drawn on top = forward
  $("downBtn").onclick=()=>move(-1);

  // ---------- add buttons ----------
  document.querySelectorAll("[data-add]").forEach(b=>{
    b.addEventListener("click",()=>addObject(b.dataset.add));
  });

  // ---------- canvas size + zoom ----------
  function setCanvas(w,h){
    state.canvas.w=clamp(Math.round(w),1,8000);
    state.canvas.h=clamp(Math.round(h),1,8000);
    $("cw").value=state.canvas.w; $("ch").value=state.canvas.h;
    fullRender();
  }
  $("presetSel").addEventListener("change",e=>{
    const v=e.target.value;
    if(v==="custom") return;
    const [w,h]=v.split("x").map(Number); setCanvas(w,h); fitZoom();
  });
  $("cw").addEventListener("change",()=>{ $("presetSel").value="custom"; setCanvas(+$("cw").value,state.canvas.h); });
  $("ch").addEventListener("change",()=>{ $("presetSel").value="custom"; setCanvas(state.canvas.w,+$("ch").value); });
  $("gridChk").addEventListener("change",e=>{ state.grid=e.target.checked; fullRender(); });

  function setZoom(z){ state.zoom=clamp(z,0.1,40); fullRender(); }
  $("zoomIn").onclick=()=>setZoom(state.zoom*1.25);
  $("zoomOut").onclick=()=>setZoom(state.zoom/1.25);
  function fitZoom(){
    const wrap=$("stageWrap").getBoundingClientRect();
    const z=Math.min((wrap.width-60)/state.canvas.w,(wrap.height-60)/state.canvas.h);
    setZoom(clamp(z,0.1,40));
  }
  $("zoomFit").onclick=fitZoom;

  // ---------- fonts ----------
  $("fontBtn").onclick=()=>$("fontInput").click();
  $("fontInput").addEventListener("change",e=>{
    const file=e.target.files[0]; if(!file) return;
    const r=new FileReader();
    r.onload=async ()=>{
      const dataUrl=r.result;
      const name=file.name.replace(/\.[^.]+$/,"").replace(/[^A-Za-z0-9_-]/g,"_") || ("font"+uid());
      try{
        const face=new FontFace(name, `url(${dataUrl})`);
        await face.load(); document.fonts.add(face);
      }catch(err){ alert("Could not load that font file."); return; }
      state.fonts.push({name,dataUrl});
      // if a text object is selected, switch it to the new font
      const o=getSel(); if(o&&o.type==="text") o.fontFamily=name;
      panelKey=""; fullRender();
    };
    r.readAsDataURL(file);
    e.target.value="";
  });

  // ---------- export ----------
  function buildExportSVG(){
    const clone=stage.cloneNode(true);
    // strip editor-only nodes
    clone.querySelectorAll('[data-empty],[data-handle]').forEach(n=>n.remove());
    // remove grid + overlay groups (the trailing <g> with pointer-events none)
    clone.querySelectorAll('g[pointer-events="none"]').forEach(n=>n.remove());
    clone.querySelectorAll('[data-id]').forEach(n=>{ n.removeAttribute("data-id"); n.removeAttribute("pointer-events"); });
    clone.removeAttribute("style");
    clone.setAttribute("xmlns",NS);
    clone.setAttribute("width",state.canvas.w);
    clone.setAttribute("height",state.canvas.h);
    clone.setAttribute("viewBox",`0 0 ${state.canvas.w} ${state.canvas.h}`);
    // embed fonts actually used
    const used=new Set(state.objects.filter(o=>o.type==="text").map(o=>o.fontFamily));
    const faces=state.fonts.filter(f=>used.has(f.name));
    if(faces.length){
      const css=faces.map(f=>`@font-face{font-family:'${f.name}';src:url(${f.dataUrl});}`).join("\n");
      const style=document.createElementNS(NS,"style");
      style.textContent=css;
      let defs=clone.querySelector("defs");
      if(!defs){ defs=document.createElementNS(NS,"defs"); clone.insertBefore(defs,clone.firstChild); }
      defs.insertBefore(style,defs.firstChild);
    }
    return '<?xml version="1.0" encoding="UTF-8"?>\n'+new XMLSerializer().serializeToString(clone);
  }
  function downloadBlob(blob,name){
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download=name; a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
  $("exportSvg").onclick=()=>{
    const svg=buildExportSVG();
    downloadBlob(new Blob([svg],{type:"image/svg+xml"}),`logo_${state.canvas.w}x${state.canvas.h}.svg`);
  };
  $("exportPng").onclick=()=>{
    const scale=parseInt($("pngScale").value,10);
    const tw=state.canvas.w*scale, th=state.canvas.h*scale;
    const ss=2; // internal supersample for clean edges
    const svgStr=buildExportSVG();
    const blob=new Blob([svgStr],{type:"image/svg+xml;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const img=new Image();
    img.onload=()=>{
      const big=document.createElement("canvas"); big.width=tw*ss; big.height=th*ss;
      big.getContext("2d").drawImage(img,0,0,big.width,big.height);
      const out=document.createElement("canvas"); out.width=tw; out.height=th;
      const c=out.getContext("2d"); c.imageSmoothingEnabled=true; c.imageSmoothingQuality="high";
      c.drawImage(big,0,0,tw,th);
      out.toBlob(b=>{ downloadBlob(b,`logo_${tw}x${th}.png`); URL.revokeObjectURL(url); },"image/png");
    };
    img.onerror=()=>{ alert("PNG render failed. If you used a custom font, try re-uploading it."); URL.revokeObjectURL(url); };
    img.src=url;
  };

  // ---------- project save / load ----------
  $("saveBtn").onclick=()=>{
    const data={version:1,canvas:state.canvas,objects:state.objects,fonts:state.fonts,nextId:state.nextId};
    downloadBlob(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),"svgforge_project.json");
  };
  $("loadBtn").onclick=()=>$("loadInput").click();
  $("loadInput").addEventListener("change",e=>{
    const file=e.target.files[0]; if(!file) return;
    const r=new FileReader();
    r.onload=async ()=>{
      try{
        const d=JSON.parse(r.result);
        if(!d.canvas||!Array.isArray(d.objects)) throw new Error("bad file");
        state.canvas=d.canvas; state.objects=d.objects;
        state.fonts=Array.isArray(d.fonts)?d.fonts:[];
        state.nextId=d.nextId||(Math.max(0,...state.objects.map(o=>o.id))+1);
        state.selectedId=null; panelKey="";
        for(const f of state.fonts){
          try{ const face=new FontFace(f.name,`url(${f.dataUrl})`); await face.load(); document.fonts.add(face);}catch(_){}
        }
        $("cw").value=state.canvas.w; $("ch").value=state.canvas.h; $("presetSel").value="custom";
        fitZoom();
      }catch(err){ alert("Could not load project: "+err.message); }
    };
    r.readAsText(file); e.target.value="";
  });

  // ---------- boot ----------
  function seed(){
    // a small starter so the canvas isn't blank
    const hex=defaultObject("hexagon");
    hex.fillMode="none"; hex.stroke="#22d3ee"; hex.strokeWidth=2.2; hex.glow=true;
    hex.x=10; hex.y=6; hex.w=46; hex.h=52;
    state.objects.push(hex);
    const t=defaultObject("text");
    t.text="watcher"; t.x=66; t.y=34; t.fontSize=18; t.glow=true;
    state.objects.push(t);
    state.selectedId=t.id;
  }
  seed();
  fullRender();
  fitZoom();
})();
</script>
</body>
</html>
