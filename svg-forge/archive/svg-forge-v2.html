<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVG Forge — offline logo &amp; icon maker</title>
<style>
  :root{
    --bg:#0a0e0f; --panel:#11161a; --panel2:#0c1113; --line:#1e2a2e;
    --text:#b8c9c2; --dim:#6b827a; --bright:#e8fff4;
    --cyan:#22d3ee; --green:#4ade80;
    --mono: ui-monospace,"DejaVu Sans Mono","SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg); color:var(--text); font-family:var(--mono);
    font-size:13px; display:flex; flex-direction:column; overflow:hidden}
  h2,.eyebrow{font-family:var(--mono); letter-spacing:.18em; text-transform:uppercase}
  header{display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    padding:8px 12px; border-bottom:1px solid var(--line); background:var(--panel2)}
  .brand{font-size:14px; font-weight:bold; color:var(--bright); letter-spacing:.22em}
  .brand b{background:linear-gradient(120deg,var(--cyan),var(--green));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent}
  .bar-group{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
  .sep{width:1px; height:22px; background:var(--line)}
  label.lbl{color:var(--dim); font-size:11px; letter-spacing:.12em; text-transform:uppercase}
  button, select, input{font-family:var(--mono); font-size:12px; color:var(--text);
    background:var(--panel); border:1px solid var(--line); border-radius:5px;
    padding:5px 9px; cursor:pointer; transition:border-color .12s, color .12s}
  button:hover, select:hover{border-color:var(--cyan); color:var(--bright)}
  button:active{transform:translateY(1px)}
  button.primary{border-color:#244; color:var(--cyan)}
  button.primary:hover{border-color:var(--cyan); box-shadow:0 0 10px rgba(34,211,238,.25)}
  button.on{border-color:var(--green); color:var(--green); box-shadow:0 0 8px rgba(74,222,128,.3)}
  input{cursor:text}
  input[type=number]{width:62px}
  input[type=color]{padding:2px; width:34px; height:28px; cursor:pointer}
  input[type=checkbox]{width:14px;height:14px;accent-color:var(--green);cursor:pointer}
  input:focus, select:focus, button:focus-visible{outline:2px solid var(--cyan); outline-offset:1px}
  main{flex:1; display:grid; grid-template-columns:208px 1fr 252px; min-height:0}
  .col{overflow-y:auto; padding:12px}
  .col.left{border-right:1px solid var(--line); background:var(--panel2)}
  .col.right{border-left:1px solid var(--line); background:var(--panel2)}
  .stage-wrap{display:flex; align-items:center; justify-content:center; overflow:auto; padding:24px;
    background:radial-gradient(circle at 50% 0%, rgba(34,211,238,.05), transparent 60%), var(--bg)}
  .stage-canvas{--c1:#13191b; --c2:#0d1113; background-color:var(--c2);
    background-image:linear-gradient(45deg,var(--c1) 25%,transparent 25%),
      linear-gradient(-45deg,var(--c1) 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,var(--c1) 75%),
      linear-gradient(-45deg,transparent 75%,var(--c1) 75%);
    background-size:16px 16px; background-position:0 0,0 8px,8px -8px,-8px 0;
    box-shadow:0 0 0 1px var(--line), 0 12px 40px rgba(0,0,0,.5); line-height:0}
  svg#stage{display:block; touch-action:none}
  .panel-title{color:var(--cyan); font-size:11px; margin:0 0 10px; letter-spacing:.2em}
  .field{display:flex; align-items:center; justify-content:space-between; gap:8px; margin:7px 0}
  .field > label{color:var(--dim); font-size:11px; white-space:nowrap}
  .field input[type=text]{width:100%}
  .hint{color:var(--dim); font-size:11px; line-height:1.5; margin:8px 0 0}
  .layer{display:flex; align-items:center; gap:6px; padding:6px 7px; margin:3px 0;
    border:1px solid transparent; border-radius:5px; cursor:pointer; background:var(--panel)}
  .layer:hover{border-color:var(--line)}
  .layer.sel{border-color:var(--cyan); color:var(--bright); box-shadow:inset 0 0 0 1px rgba(34,211,238,.2)}
  .layer .tag{font-size:10px; color:var(--dim); text-transform:uppercase}
  .layer .nm{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .layer-actions{display:flex; gap:4px; margin-top:8px}
  .layer-actions button{flex:1; padding:5px 0; font-size:11px}
  .add-grid{display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:6px}
  .add-grid button{padding:8px 4px}
  .wide{width:100%; margin-top:6px}
  .empty{color:var(--dim); font-size:11px; padding:10px 4px; line-height:1.5}
  .align-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:4px; margin:4px 0 10px}
  .align-grid button{padding:6px 0; font-size:13px}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#1c2629;border-radius:6px}
  ::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<header>
  <span class="brand">SVG&nbsp;<b>FORGE</b></span>
  <div class="sep"></div>
  <div class="bar-group">
    <label class="lbl">Canvas</label>
    <select id="presetSel" title="Canvas size preset">
      <option value="190x64">190 × 64  (GDM logo)</option>
      <option value="380x128">380 × 128</option>
      <option value="759x256">759 × 256</option>
      <option value="64x64">64 × 64  (icon)</option>
      <option value="128x128">128 × 128</option>
      <option value="256x256">256 × 256</option>
      <option value="512x512">512 × 512</option>
      <option value="custom">custom…</option>
    </select>
    <input type="number" id="cw" min="1" max="8000" value="190" title="Canvas width">
    <input type="number" id="ch" min="1" max="8000" value="64" title="Canvas height">
  </div>
  <div class="sep"></div>
  <div class="bar-group">
    <label class="lbl">Zoom</label>
    <button id="zoomOut" title="Zoom out">−</button>
    <span id="zoomVal" style="min-width:42px;text-align:center;color:var(--dim)">100%</span>
    <button id="zoomIn" title="Zoom in">+</button>
    <button id="zoomFit" title="Fit to view">fit</button>
    <label class="lbl" style="margin-left:6px"><input type="checkbox" id="gridChk"> grid</label>
  </div>
  <div class="sep"></div>
  <div class="bar-group">
    <button id="importBtn" title="Import an .svg file as an element">↑ SVG</button>
    <input type="file" id="importInput" accept=".svg,image/svg+xml" hidden>
    <button id="fontBtn" title="Upload a .ttf / .otf / .woff font">↑ font</button>
    <input type="file" id="fontInput" accept=".ttf,.otf,.woff,.woff2,font/*" hidden>
    <button id="saveBtn" title="Save project (.json)">save</button>
    <button id="loadBtn" title="Load project (.json)">load</button>
    <input type="file" id="loadInput" accept=".json,application/json" hidden>
  </div>
  <div class="sep"></div>
  <div class="bar-group">
    <button class="primary" id="exportSvg">⤓ SVG</button>
    <label class="lbl">PNG&nbsp;×</label>
    <select id="pngScale" title="PNG export scale">
      <option value="1">1×</option><option value="2">2×</option>
      <option value="4" selected>4×</option><option value="8">8×</option>
    </select>
    <button class="primary" id="exportPng">⤓ PNG</button>
  </div>
</header>

<main>
  <section class="col left">
    <h2 class="panel-title">Add element</h2>
    <div class="add-grid">
      <button data-add="rect">▭ Rect</button>
      <button data-add="ellipse">◯ Ellipse</button>
      <button data-add="triangle">△ Triangle</button>
      <button data-add="hexagon">⬡ Hexagon</button>
      <button data-add="star">★ Star</button>
      <button data-add="text">T Text</button>
    </div>
    <button data-add="line" class="wide">— Line</button>
    <button id="penBtn" class="wide" title="Click to place points; Enter or double-click to finish, Esc to cancel">✎ Pen (freeform)</button>

    <h2 class="panel-title" style="margin-top:20px">Layers</h2>
    <div id="layers"></div>
    <div class="layer-actions">
      <button id="dupBtn" title="Duplicate">dup</button>
      <button id="upBtn" title="Bring forward">↑</button>
      <button id="downBtn" title="Send back">↓</button>
      <button id="delBtn" title="Delete">del</button>
    </div>
    <p class="hint">Drag to move. Shift-click or drag a box to multi-select. Arrows nudge (Shift ×10). Delete removes.</p>
  </section>

  <section class="stage-wrap" id="stageWrap">
    <div class="stage-canvas" id="stageCanvas">
      <svg id="stage" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </section>

  <section class="col right">
    <h2 class="panel-title">Properties</h2>
    <div id="props"><div class="empty">Nothing selected. Add an element or pick a layer.</div></div>
  </section>
</main>

<script>
"use strict";
(function(){
  const NS="http://www.w3.org/2000/svg";
  const state={
    canvas:{w:190,h:64}, objects:[], selected:[], fonts:[], nextId:1,
    zoom:3, grid:false, penMode:false, pen:null, penMouse:null, importSeq:1,
  };
  const $=id=>document.getElementById(id);
  const stage=$("stage");
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const uid=()=>state.nextId++;
  const escapeHtml=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  // ---------- selection helpers ----------
  const isSel=id=>state.selected.indexOf(id)>=0;
  const primaryId=()=>state.selected.length?state.selected[state.selected.length-1]:null;
  const getObj=id=>state.objects.find(o=>o.id===id)||null;
  const getSel=()=>getObj(primaryId());
  const selObjs=()=>state.selected.map(getObj).filter(Boolean);
  function selectOnly(id){ state.selected=id==null?[]:[id]; }
  function toggleSel(id){ const i=state.selected.indexOf(id); if(i>=0) state.selected.splice(i,1); else state.selected.push(id); }
  function clearSel(){ state.selected=[]; }

  // ---------- defaults ----------
  function defaultObject(type){
    const c=state.canvas;
    const o={ id:uid(), type,
      x:Math.round(c.w*0.30), y:Math.round(c.h*0.30),
      w:Math.round(Math.min(c.w,c.h)*0.4), h:Math.round(Math.min(c.w,c.h)*0.4),
      rotation:0, opacity:1, fillMode:"solid", fill:"#22d3ee",
      grad:["#22d3ee","#4ade80"], gradAngle:135, stroke:"#000000", strokeWidth:0,
      glow:false, glowStrength:1.1 };
    if(type==="rect") o.rx=0;
    if(type==="line"){ o.fillMode="none"; o.stroke="#22d3ee"; o.strokeWidth=3; o.w=Math.round(c.w*0.4); o.h=0; }
    if(type==="text"){ o.text="watcher"; o.fontFamily="__mono"; o.fontSize=Math.round(c.h*0.4);
      o.fontWeight="bold"; o.letterSpacing=0; o.fillMode="gradient";
      o.x=Math.round(c.w*0.2); o.y=Math.round(c.h*0.6); }
    return o;
  }
  function addObject(type){ const o=defaultObject(type); state.objects.push(o); selectOnly(o.id); fullRender(); }
  function createPath(points,closed){
    const o={ id:uid(), type:"path", points, closed, rotation:0, opacity:1,
      fillMode:"none", fill:"#22d3ee", grad:["#22d3ee","#4ade80"], gradAngle:135,
      stroke:"#22d3ee", strokeWidth:2, glow:false, glowStrength:1.1 };
    state.objects.push(o); selectOnly(o.id); fullRender();
  }

  // ---------- geometry ----------
  function polyPoints(type,o){
    const {x,y,w,h}=o;
    const map=pts=>pts.map(p=>`${(x+p[0]*w).toFixed(2)},${(y+p[1]*h).toFixed(2)}`).join(" ");
    if(type==="triangle") return map([[0.5,0],[1,1],[0,1]]);
    if(type==="hexagon")  return map([[0.5,0],[1,0.25],[1,0.75],[0.5,1],[0,0.75],[0,0.25]]);
    if(type==="star"){ const pts=[],cx=0.5,cy=0.5,oR=0.5,iR=0.22;
      for(let i=0;i<10;i++){ const r=(i%2===0)?oR:iR, a=(-90+i*36)*Math.PI/180;
        pts.push([cx+r*Math.cos(a), cy+r*Math.sin(a)]); }
      return map(pts); }
    return "";
  }
  function pathD(o){
    if(!o.points.length) return "";
    let d="M "+o.points.map(p=>p[0].toFixed(2)+" "+p[1].toFixed(2)).join(" L ");
    if(o.closed) d+=" Z";
    return d;
  }
  function pointsBbox(points){
    let minx=Infinity,miny=Infinity,maxx=-Infinity,maxy=-Infinity;
    for(const p of points){ minx=Math.min(minx,p[0]); miny=Math.min(miny,p[1]); maxx=Math.max(maxx,p[0]); maxy=Math.max(maxy,p[1]); }
    if(!isFinite(minx)) return {x:0,y:0,w:1,h:1};
    return {x:minx,y:miny,w:Math.max(1e-6,maxx-minx),h:Math.max(1e-6,maxy-miny)};
  }
  function bboxOf(o){
    if(o.type==="text"){
      const el=stage.querySelector(`[data-id="${o.id}"]`);
      if(el){ try{ const b=el.getBBox(); return {x:b.x,y:b.y,w:b.width,h:b.height}; }catch(e){} }
      return {x:o.x,y:o.y-o.fontSize,w:o.fontSize*4,h:o.fontSize};
    }
    if(o.type==="line") return {x:Math.min(o.x,o.x+o.w),y:Math.min(o.y,o.y+o.h),w:Math.abs(o.w)||1,h:Math.abs(o.h)||1};
    if(o.type==="path") return pointsBbox(o.points);
    return {x:o.x,y:o.y,w:o.w,h:o.h};
  }
  function unionBbox(objs){
    let minx=Infinity,miny=Infinity,maxx=-Infinity,maxy=-Infinity;
    for(const o of objs){ const b=bboxOf(o);
      minx=Math.min(minx,b.x); miny=Math.min(miny,b.y); maxx=Math.max(maxx,b.x+b.w); maxy=Math.max(maxy,b.y+b.h); }
    return {x:minx,y:miny,w:maxx-minx,h:maxy-miny};
  }
  function translateObj(o,dx,dy){
    if(o.type==="path") o.points=o.points.map(p=>[p[0]+dx,p[1]+dy]);
    else { o.x=Math.round((o.x+dx)*1000)/1000; o.y=Math.round((o.y+dy)*1000)/1000; }
  }
  function scalePathToBbox(o,origPoints,origB,nb){
    o.points=origPoints.map(p=>[
      nb.x+(p[0]-origB.x)/origB.w*nb.w,
      nb.y+(p[1]-origB.y)/origB.h*nb.h ]);
  }

  // ---------- rendering ----------
  function fontFamilyValue(o){
    if(o.fontFamily==="__mono") return "ui-monospace, monospace";
    if(o.fontFamily==="__sans") return "system-ui, sans-serif";
    if(o.fontFamily==="__serif") return "Georgia, serif";
    return `'${o.fontFamily}'`;
  }
  function makeDefsFor(o,defs){
    if(o.fillMode==="gradient"){
      const g=document.createElementNS(NS,"linearGradient");
      g.setAttribute("id",`grad_${o.id}`);
      const a=o.gradAngle*Math.PI/180;
      g.setAttribute("x1",(0.5-Math.cos(a)*0.5).toFixed(4));
      g.setAttribute("y1",(0.5-Math.sin(a)*0.5).toFixed(4));
      g.setAttribute("x2",(0.5+Math.cos(a)*0.5).toFixed(4));
      g.setAttribute("y2",(0.5+Math.sin(a)*0.5).toFixed(4));
      [0,1].forEach(i=>{ const s=document.createElementNS(NS,"stop");
        s.setAttribute("offset",i); s.setAttribute("stop-color",o.grad[i]); g.appendChild(s); });
      defs.appendChild(g);
    }
    if(o.glow){
      const f=document.createElementNS(NS,"filter");
      f.setAttribute("id",`glow_${o.id}`);
      f.setAttribute("x","-50%");f.setAttribute("y","-50%");f.setAttribute("width","200%");f.setAttribute("height","200%");
      const b=document.createElementNS(NS,"feGaussianBlur");
      b.setAttribute("stdDeviation",o.glowStrength); b.setAttribute("result","b");
      const m=document.createElementNS(NS,"feMerge");
      ["b","SourceGraphic"].forEach(n=>{ const mn=document.createElementNS(NS,"feMergeNode"); mn.setAttribute("in",n); m.appendChild(mn); });
      f.appendChild(b); f.appendChild(m); defs.appendChild(f);
    }
  }
  const paint=o=> o.fillMode==="none"?"none": o.fillMode==="gradient"?`url(#grad_${o.id})`: o.fill;

  function rotAttr(o){
    if(!o.rotation) return null;
    const b=(o.type==="text")?{x:o.x,y:o.y,w:0,h:0}:bboxOf(o);
    return `rotate(${o.rotation} ${(b.x+b.w/2).toFixed(3)} ${(b.y+b.h/2).toFixed(3)})`;
  }

  function makeElement(o){
    if(o.type==="svggroup") return makeSvgGroup(o);
    let el;
    if(o.type==="rect"){ el=document.createElementNS(NS,"rect");
      el.setAttribute("x",o.x);el.setAttribute("y",o.y);
      el.setAttribute("width",Math.max(0,o.w));el.setAttribute("height",Math.max(0,o.h));
      if(o.rx) el.setAttribute("rx",o.rx);
    } else if(o.type==="ellipse"){ el=document.createElementNS(NS,"ellipse");
      el.setAttribute("cx",o.x+o.w/2);el.setAttribute("cy",o.y+o.h/2);
      el.setAttribute("rx",Math.max(0,o.w/2));el.setAttribute("ry",Math.max(0,o.h/2));
    } else if(o.type==="line"){ el=document.createElementNS(NS,"line");
      el.setAttribute("x1",o.x);el.setAttribute("y1",o.y);
      el.setAttribute("x2",o.x+o.w);el.setAttribute("y2",o.y+o.h);
      el.setAttribute("stroke-linecap","round");
    } else if(o.type==="path"){ el=document.createElementNS(NS,"path");
      el.setAttribute("d",pathD(o)); el.setAttribute("stroke-linejoin","round"); el.setAttribute("stroke-linecap","round");
    } else if(o.type==="text"){ el=document.createElementNS(NS,"text");
      el.setAttribute("x",o.x);el.setAttribute("y",o.y);
      el.setAttribute("font-family",fontFamilyValue(o));
      el.setAttribute("font-size",o.fontSize);el.setAttribute("font-weight",o.fontWeight);
      if(o.letterSpacing) el.setAttribute("letter-spacing",o.letterSpacing);
      el.textContent=o.text;
    } else { el=document.createElementNS(NS,"polygon"); el.setAttribute("points",polyPoints(o.type,o)); }

    const strokeColor=(o.fillMode==="gradient" && (o.type==="line"||o.type==="path"))?`url(#grad_${o.id})`:o.stroke;
    el.setAttribute("fill",(o.type==="line")?"none":paint(o));
    if(o.strokeWidth>0 || o.type==="line"){
      el.setAttribute("stroke",strokeColor);
      el.setAttribute("stroke-width",o.strokeWidth||(o.type==="line"?3:0));
      if(!el.getAttribute("stroke-linejoin")) el.setAttribute("stroke-linejoin","round");
    }
    if(o.opacity!==1) el.setAttribute("opacity",o.opacity);
    if(o.glow) el.setAttribute("filter",`url(#glow_${o.id})`);
    const r=rotAttr(o); if(r) el.setAttribute("transform",r);
    el.setAttribute("data-id",o.id); el.setAttribute("pointer-events","all");
    return el;
  }

  function makeSvgGroup(o){
    const wrap=document.createElementNS(NS,"g");
    const sx=o.w/(o.vbW||1), sy=o.h/(o.vbH||1);
    const r=rotAttr(o);
    const vis=document.createElementNS(NS,"g");
    vis.setAttribute("transform",(r?r+" ":"")+`translate(${o.x} ${o.y}) scale(${sx} ${sy})`);
    vis.setAttribute("pointer-events","none");
    if(o.opacity!==1) vis.setAttribute("opacity",o.opacity);
    vis.innerHTML=o.src;
    const hit=document.createElementNS(NS,"rect");
    hit.setAttribute("x",o.x);hit.setAttribute("y",o.y);
    hit.setAttribute("width",Math.max(0,o.w));hit.setAttribute("height",Math.max(0,o.h));
    hit.setAttribute("fill","transparent");
    if(r) hit.setAttribute("transform",r);
    hit.setAttribute("data-id",o.id); hit.setAttribute("data-hit","1"); hit.setAttribute("pointer-events","all");
    wrap.appendChild(vis); wrap.appendChild(hit);
    return wrap;
  }

  function applyZoom(){
    const z=state.zoom;
    stage.style.width=(state.canvas.w*z)+"px";
    stage.style.height=(state.canvas.h*z)+"px";
    stage.setAttribute("viewBox",`0 0 ${state.canvas.w} ${state.canvas.h}`);
    $("zoomVal").textContent=Math.round(z*100)+"%";
  }
  function drawGrid(){
    if(!state.grid) return;
    const g=document.createElementNS(NS,"g"); g.setAttribute("data-editor","1"); g.setAttribute("pointer-events","none");
    const step=Math.max(8,Math.round(Math.min(state.canvas.w,state.canvas.h)/8));
    const mk=(x1,y1,x2,y2)=>{const l=document.createElementNS(NS,"line");
      l.setAttribute("x1",x1);l.setAttribute("y1",y1);l.setAttribute("x2",x2);l.setAttribute("y2",y2);
      l.setAttribute("stroke","#22d3ee");l.setAttribute("stroke-width",0.4/state.zoom);l.setAttribute("opacity",0.18);g.appendChild(l);};
    for(let x=step;x<state.canvas.w;x+=step) mk(x,0,x,state.canvas.h);
    for(let y=step;y<state.canvas.h;y+=step) mk(0,y,state.canvas.w,y);
    stage.appendChild(g);
  }
  function drawOverlay(){
    const s=1/state.zoom;
    const objs=selObjs(); if(!objs.length) return;
    const g=document.createElementNS(NS,"g"); g.setAttribute("data-editor","1"); g.setAttribute("pointer-events","none");
    for(const o of objs){
      const b=bboxOf(o);
      const grp=document.createElementNS(NS,"g");
      const r=rotAttr(o); if(r) grp.setAttribute("transform",r);
      const box=document.createElementNS(NS,"rect");
      box.setAttribute("x",b.x);box.setAttribute("y",b.y);box.setAttribute("width",b.w);box.setAttribute("height",b.h);
      box.setAttribute("fill","none");box.setAttribute("stroke","#22d3ee");
      box.setAttribute("stroke-width",1*s);box.setAttribute("stroke-dasharray",`${4*s} ${3*s}`);
      grp.appendChild(box); g.appendChild(grp);
    }
    // resize handles only for a single, non-rotated, resizable object
    if(objs.length===1){
      const o=objs[0], b=bboxOf(o);
      const resizable=o.rotation===0 && o.type!=="text" && o.type!=="line";
      if(resizable){
        const hs=7*s, corners={nw:[b.x,b.y],ne:[b.x+b.w,b.y],sw:[b.x,b.y+b.h],se:[b.x+b.w,b.y+b.h]};
        for(const k in corners){ const [hx,hy]=corners[k];
          const r=document.createElementNS(NS,"rect");
          r.setAttribute("x",hx-hs/2);r.setAttribute("y",hy-hs/2);r.setAttribute("width",hs);r.setAttribute("height",hs);
          r.setAttribute("fill","#0a0e0f");r.setAttribute("stroke","#22d3ee");r.setAttribute("stroke-width",1*s);
          r.setAttribute("data-handle",k);r.setAttribute("pointer-events","all");

      }

  }
  function drawPenPreview(){
    if(!state.penMode||!state.pen) return;
    const s=1/state.zoom;
    const g=document.createElementNS(NS,"g"); g.setAttribute("data-editor","1"); g.setAttribute("pointer-events","none");
    const pts=state.pen.points.slice();
    if(pts.length){
      let d="M "+pts.map(p=>p[0]+" "+p[1]).join(" L ");
      const path=document.createElementNS(NS,"path"); path.setAttribute("d",d);
      path.setAttribute("fill","none");path.setAttribute("stroke","#4ade80");path.setAttribute("stroke-width",1.4*s);
      g.appendChild(path);
      if(state.penMouse){ const rb=document.createElementNS(NS,"line");
        const last=pts[pts.length-1];
        rb.setAttribute("x1",last[0]);rb.setAttribute("y1",last[1]);
        rb.setAttribute("x2",state.penMouse[0]);rb.setAttribute("y2",state.penMouse[1]);
        rb.setAttribute("stroke","#4ade80");rb.setAttribute("stroke-width",1*s);rb.setAttribute("stroke-dasharray",`${3*s} ${2*s}`);
        rb.setAttribute("opacity",0.7); g.appendChild(rb); }
      pts.forEach((p,i)=>{ const c=document.createElementNS(NS,"circle");
        c.setAttribute("cx",p[0]);c.setAttribute("cy",p[1]);c.setAttribute("r",(i===0?3.2:2.4)*s);
        c.setAttribute("fill",i===0?"#22d3ee":"#0a0e0f");c.setAttribute("stroke","#4ade80");c.setAttribute("stroke-width",1*s);
        g.appendChild(c); });
    }
    stage.appendChild(g);
  }
  let marqueeEl=null;
  function fullRender(){
    applyZoom();
    stage.innerHTML="";
    const bg=document.createElementNS(NS,"rect");
    bg.setAttribute("x",0);bg.setAttribute("y",0);
    bg.setAttribute("width",state.canvas.w);bg.setAttribute("height",state.canvas.h);
    bg.setAttribute("fill","transparent");bg.setAttribute("data-empty","1");bg.setAttribute("pointer-events","all");
    stage.appendChild(bg);

    for(const o of state.objects){ makeDefsFor(o,defs); stage.appendChild(makeElement(o)); }

    marqueeEl=null;
    renderLayers(); syncPanel();
  }

  // ---------- layers ----------
  function renderLayers(){
    const box=$("layers"); box.innerHTML="";
    if(!state.objects.length){ box.innerHTML='<div class="empty">No elements yet.</div>'; return; }
    [...state.objects].reverse().forEach(o=>{
      const d=document.createElement("div");
      d.className="layer"+(isSel(o.id)?" sel":"");
      const name=o.type==="text"?`"${o.text}"`:(o.type==="svggroup"?"imported svg":o.type);
      d.innerHTML=`<span class="tag">${o.type[0]}</span><span class="nm">${escapeHtml(name)}</span>`;
      d.addEventListener("click",e=>{ if(e.shiftKey) toggleSel(o.id); else selectOnly(o.id); fullRender(); });
      box.appendChild(d);
    });
  }

  // ---------- properties ----------
  let panelKey="";
  function selKey(){ const n=state.selected.length; const p=getSel();
    return state.selected.join(",")+"|"+(n===1&&p?p.type:("multi"+n)); }
  function syncPanel(){ const k=selKey(); if(k!==panelKey){ buildPanel(); panelKey=k; } else refreshPanel(); }

  const field=(label,html)=>`<div class="field"><label>${label}</label>${html}</div>`;
  function styleControls(multi){
    const m=multi?' data-multi="1"':'';
    let h=`<div class="sep" style="height:1px;width:100%;margin:12px 0"></div>`;
    h+=field("Fill",`<select data-k="fillMode"${m}><option value="solid">solid</option><option value="gradient">gradient</option><option value="none">none</option></select>`);
    h+=`<div data-grp="solid">`+field("Color",`<input type="color" data-k="fill"${m}>`)+`</div>`;
    h+=`<div data-grp="gradient">`+field("From",`<input type="color" data-k="grad0"${m}>`)
       +field("To",`<input type="color" data-k="grad1"${m}>`)
       +field("Angle",`<input type="number" data-k="gradAngle" step="5"${m}>`)+`</div>`;
    h+=`<div class="sep" style="height:1px;width:100%;margin:12px 0"></div>`;
    h+=field("Stroke",`<input type="color" data-k="stroke"${m}>`);
    h+=field("Stroke W",`<input type="number" data-k="strokeWidth" min="0" step="0.5"${m}>`);
    h+=field("Glow",`<input type="checkbox" data-k="glow"${m}>`);
    h+=field("Glow str",`<input type="number" data-k="glowStrength" min="0" step="0.1"${m}>`);
    return h;
  }
  const alignBlock=`<h2 class="panel-title" style="margin-top:6px">Align</h2><div class="align-grid">
    <button data-align="left" title="Left">⇤</button><button data-align="cx" title="Center">↔</button><button data-align="right" title="Right">⇥</button>
    <button data-align="top" title="Top">⤒</button><button data-align="cy" title="Middle">↕</button><button data-align="bottom" title="Bottom">⤓</button></div>`;

  function buildPanel(){
    const host=$("props"); const n=state.selected.length; const o=getSel();
    if(n===0){ host.innerHTML='<div class="empty">Nothing selected. Add an element or pick a layer.</div>'; return; }
    let h="";
    if(n>1){
      h+=`<div class="empty" style="padding:2px 4px 8px">${n} elements selected — shared style applies to all.</div>`;
      h+=alignBlock;
      h+=styleControls(true);
    } else {
      if(o.type==="svggroup"){
        h+=field("X",`<input type="number" data-k="x" step="1">`)+field("Y",`<input type="number" data-k="y" step="1">`);
        h+=field("W",`<input type="number" data-k="w" step="1">`)+field("H",`<input type="number" data-k="h" step="1">`);
        h+=field("Rotate",`<input type="number" data-k="rotation" step="1">`);
        h+=field("Opacity",`<input type="number" data-k="opacity" min="0" max="1" step="0.05">`);
        h+=alignBlock;
      } else {
        const isPath=o.type==="path";
        h+=field("X",`<input type="number" data-pk="x" step="1">`)+field("Y",`<input type="number" data-pk="y" step="1">`);
        if(o.type!=="text"){ h+=field(o.type==="line"?"ΔX":"W",`<input type="number" data-pk="w" step="1">`);
          h+=field(o.type==="line"?"ΔY":"H",`<input type="number" data-pk="h" step="1">`); }
        h+=field("Rotate",`<input type="number" data-k="rotation" step="1">`);
        h+=field("Opacity",`<input type="number" data-k="opacity" min="0" max="1" step="0.05">`);
        if(o.type==="rect") h+=field("Corner",`<input type="number" data-k="rx" min="0" step="1">`);
        if(isPath) h+=field("Closed",`<input type="checkbox" data-k="closed">`);
        if(o.type==="text"){
          h+=field("Text",`<input type="text" data-k="text">`);
          const fontOpts=`<option value="__mono">Mono (system)</option><option value="__sans">Sans (system)</option><option value="__serif">Serif (system)</option>`
            +state.fonts.map(f=>`<option value="${escapeHtml(f.name)}">${escapeHtml(f.name)}</option>`).join("");
          h+=field("Font",`<select data-k="fontFamily">${fontOpts}</select>`);
          h+=field("Size",`<input type="number" data-k="fontSize" min="1" step="1">`);
          h+=field("Weight",`<select data-k="fontWeight"><option value="normal">normal</option><option value="bold">bold</option></select>`);
          h+=field("Spacing",`<input type="number" data-k="letterSpacing" step="0.5">`);
        }
        h+=alignBlock;
        h+=styleControls(false);
      }
    }
    host.innerHTML=h;
    host.querySelectorAll("[data-k],[data-pk]").forEach(inp=>{
      const ev=(inp.type==="checkbox"||inp.tagName==="SELECT")?"change":"input";
      inp.addEventListener(ev,onPanelInput);
    });
    host.querySelectorAll("[data-align]").forEach(b=>b.addEventListener("click",()=>doAlign(b.dataset.align)));
    refreshPanel();
  }

  function refreshPanel(){
    const host=$("props"); const n=state.selected.length; const o=getSel(); if(!o) return;
    const setVal=(inp,v)=>{ if(inp.type==="checkbox") inp.checked=!!v; else if(v!==undefined && document.activeElement!==inp) inp.value=v; };
    host.querySelectorAll("[data-k]").forEach(inp=>{ const k=inp.dataset.k;
      let v = k==="grad0"?o.grad[0] : k==="grad1"?o.grad[1] : o[k];
      setVal(inp,v);
    });
    if(n===1 && (o.type==="path")){
      const b=bboxOf(o);
      host.querySelectorAll("[data-pk]").forEach(inp=>{ const k=inp.dataset.pk;
        const v = k==="x"?Math.round(b.x): k==="y"?Math.round(b.y): k==="w"?Math.round(b.w):Math.round(b.h);
        setVal(inp,v); });
    } else {
      host.querySelectorAll("[data-pk]").forEach(inp=>setVal(inp,o[inp.dataset.pk]));
    }
    const gs=host.querySelector('[data-grp="solid"]'), gg=host.querySelector('[data-grp="gradient"]');
    const fm=o.fillMode;
    if(gs) gs.style.display=(fm==="solid")?"":"none";
    if(gg) gg.style.display=(fm==="gradient")?"":"none";
  }

  function onPanelInput(e){
    const inp=e.target;
    let v = inp.type==="checkbox"?inp.checked : inp.type==="number"?parseFloat(inp.value) : inp.value;
    if(inp.type==="number" && Number.isNaN(v)) return;
    if(inp.dataset.multi){
      for(const o of selObjs()) applyStyle(o,inp.dataset.k,v);
      fullRender(); return;
    }
    const o=getSel(); if(!o) return;
    if(inp.dataset.pk){ applyGeom(o,inp.dataset.pk,v); fullRender(); return; }
    const k=inp.dataset.k;
    if(k==="grad0") o.grad[0]=v; else if(k==="grad1") o.grad[1]=v; else o[k]=v;
    fullRender();
  }
  function applyStyle(o,k,v){
    if(o.type==="svggroup") return; // imported art keeps its own styling

  }
  function applyGeom(o,k,v){
    if(o.type==="path"){
      const b=bboxOf(o);
      if(k==="x") translateObj(o,v-b.x,0);
      else if(k==="y") translateObj(o,0,v-b.y);
      else if(k==="w"&&v>0){ const op=o.points.map(p=>p.slice()); scalePathToBbox(o,op,b,{x:b.x,y:b.y,w:v,h:b.h}); }
      else if(k==="h"&&v>0){ const op=o.points.map(p=>p.slice()); scalePathToBbox(o,op,b,{x:b.x,y:b.y,w:b.w,h:v}); }
    } else { o[k]=v; }
  }

  function doAlign(type){
    const objs=selObjs(); if(!objs.length) return;
    const ref = objs.length>1 ? unionBbox(objs) : {x:0,y:0,w:state.canvas.w,h:state.canvas.h};
    for(const o of objs){ const b=bboxOf(o);
      if(type==="left") translateObj(o,ref.x-b.x,0);
      if(type==="cx")   translateObj(o,(ref.x+ref.w/2)-(b.x+b.w/2),0);
      if(type==="right")translateObj(o,(ref.x+ref.w)-(b.x+b.w),0);
      if(type==="top")  translateObj(o,0,ref.y-b.y);
      if(type==="cy")   translateObj(o,0,(ref.y+ref.h/2)-(b.y+b.h/2));
      if(type==="bottom")translateObj(o,0,(ref.y+ref.h)-(b.y+b.h));
    }
    fullRender();
  }

  // ---------- pointer ----------
  let drag=null;
  function toUser(e){ const m=stage.getScreenCTM().inverse();
    const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(m); return [p.x,p.y]; }

  stage.addEventListener("pointerdown",e=>{
    const t=e.target, p=toUser(e);
    if(state.penMode){ state.pen.points.push([Math.round(p[0]),Math.round(p[1])]); fullRender(); e.preventDefault(); return; }
    if(t.dataset.handle){ const o=getSel(); if(!o) return;
      drag={mode:"resize",handle:t.dataset.handle,start:p,
            orig: o.type==="path"?{points:o.points.map(q=>q.slice()),b:bboxOf(o)}:{x:o.x,y:o.y,w:o.w,h:o.h}};
      stage.setPointerCapture(e.pointerId); e.preventDefault(); return; }
    if(t.dataset.id){ const id=parseInt(t.dataset.id,10);
      if(e.shiftKey){ toggleSel(id); fullRender(); e.preventDefault(); return; }
      if(!isSel(id)) selectOnly(id);
      drag={mode:"move",start:p,moves:selObjs().map(o=>({o,snap:o.type==="path"?{points:o.points.map(q=>q.slice())}:{x:o.x,y:o.y}}))};
      fullRender(); stage.setPointerCapture(e.pointerId); e.preventDefault(); return; }
    if(t.dataset.empty){ // begin marquee
      drag={mode:"marquee",start:p,additive:e.shiftKey,moved:false};
      if(!e.shiftKey){ clearSel(); fullRender(); }
      stage.setPointerCapture(e.pointerId); e.preventDefault(); }
  });

  stage.addEventListener("pointermove",e=>{
    if(state.penMode && state.pen){ state.penMouse=toUser(e).map(Math.round); drawOnlyPenPreview(); return; }
    if(!drag) return;
    const p=toUser(e), dx=p[0]-drag.start[0], dy=p[1]-drag.start[1];
    if(drag.mode==="move"){
      for(const m of drag.moves){ const o=m.o;
        if(o.type==="path") o.points=m.snap.points.map(q=>[q[0]+dx,q[1]+dy]);
        else { o.x=Math.round(m.snap.x+dx); o.y=Math.round(m.snap.y+dy); } }
      fullRender();
    } else if(drag.mode==="resize"){
      const o=getSel(); if(!o) return; const h=drag.handle;
      if(o.type==="path"){ const g=drag.orig.b;
        let nx=g.x,ny=g.y,nw=g.w,nh=g.h;
        if(h.includes("e")) nw=g.w+dx; if(h.includes("s")) nh=g.h+dy;
        if(h.includes("w")){ nw=g.w-dx; nx=g.x+dx; } if(h.includes("n")){ nh=g.h-dy; ny=g.y+dy; }
        nw=Math.max(1,nw); nh=Math.max(1,nh);
        scalePathToBbox(o,drag.orig.points,g,{x:nx,y:ny,w:nw,h:nh});
      } else { const g=drag.orig; let nx=g.x,ny=g.y,nw=g.w,nh=g.h;
        if(h.includes("e")) nw=g.w+dx; if(h.includes("s")) nh=g.h+dy;
        if(h.includes("w")){ nw=g.w-dx; nx=g.x+dx; } if(h.includes("n")){ nh=g.h-dy; ny=g.y+dy; }
        if(nw<1){ nw=1; if(h.includes("w")) nx=g.x+g.w-1; }
        if(nh<1){ nh=1; if(h.includes("n")) ny=g.y+g.h-1; }
        o.x=Math.round(nx);o.y=Math.round(ny);o.w=Math.round(nw);o.h=Math.round(nh); }
      fullRender();
    } else if(drag.mode==="marquee"){
      if(Math.abs(dx)>2/state.zoom||Math.abs(dy)>2/state.zoom) drag.moved=true;
      drawMarquee(drag.start,p);
    }
  });

  function endDrag(e){
    if(drag && drag.mode==="marquee"){
      if(drag.moved){ const p=toUser(e);
        const r={x:Math.min(drag.start[0],p[0]),y:Math.min(drag.start[1],p[1]),
                 w:Math.abs(p[0]-drag.start[0]),h:Math.abs(p[1]-drag.start[1])};
        const hits=state.objects.filter(o=>{ const b=bboxOf(o);
          return !(b.x>r.x+r.w||b.x+b.w<r.x||b.y>r.y+r.h||b.y+b.h<r.y); }).map(o=>o.id);
        if(drag.additive){ for(const id of hits) if(!isSel(id)) state.selected.push(id); }

      drag=null; fullRender(); return;
    }
    drag=null;
  }
  stage.addEventListener("pointerup",endDrag);
  stage.addEventListener("pointercancel",()=>{drag=null;});
  stage.addEventListener("dblclick",e=>{ if(state.penMode){ commitPen(); e.preventDefault(); } });

  // lightweight redraws to avoid full rebuild churn during hover
  function drawOnlyPenPreview(){ const old=stage.querySelectorAll('[data-editor="1"]'); old.forEach(n=>n.remove()); drawGrid(); drawOverlay(); drawPenPreview(); }
  function drawMarquee(a,b){
    if(marqueeEl) marqueeEl.remove();
    const s=1/state.zoom;
    const r=document.createElementNS(NS,"rect"); r.setAttribute("data-editor","1"); r.setAttribute("pointer-events","none");
    r.setAttribute("x",Math.min(a[0],b[0]));r.setAttribute("y",Math.min(a[1],b[1]));
    r.setAttribute("width",Math.abs(b[0]-a[0]));r.setAttribute("height",Math.abs(b[1]-a[1]));
    r.setAttribute("fill","rgba(34,211,238,0.08)");r.setAttribute("stroke","#22d3ee");
    r.setAttribute("stroke-width",1*s);r.setAttribute("stroke-dasharray",`${3*s} ${2*s}`);
    stage.appendChild(r); marqueeEl=r;
  }

  // ---------- pen tool ----------
  function setPen(on){
    state.penMode=on; state.pen=on?{points:[]}:null; state.penMouse=null;
    $("penBtn").classList.toggle("on",on);
    if(on) clearSel();
    fullRender();
  }
  function commitPen(){
    if(!state.pen){ setPen(false); return; }
    let pts=state.pen.points.slice();
    // dedupe consecutive coincident points (e.g. from double-click)
    pts=pts.filter((p,i)=> i===0 || Math.abs(p[0]-pts[i-1][0])>0.5 || Math.abs(p[1]-pts[i-1][1])>0.5);
    state.penMode=false; state.pen=null; state.penMouse=null; $("penBtn").classList.remove("on");
    if(pts.length>=2) createPath(pts, pts.length>=3);
    else fullRender();
  }
  $("penBtn").onclick=()=>setPen(!state.penMode);

  // ---------- keyboard ----------
  document.addEventListener("keydown",e=>{
    const tag=document.activeElement && document.activeElement.tagName;
    if(tag==="INPUT"||tag==="SELECT"||tag==="TEXTAREA") return;
    if(state.penMode){
      if(e.key==="Enter"){ commitPen(); e.preventDefault(); }
      else if(e.key==="Escape"){ setPen(false); e.preventDefault(); }
      else if(e.key==="Backspace"){ if(state.pen.points.length) state.pen.points.pop(); fullRender(); e.preventDefault(); }
      return;
    }
    if(e.key==="Escape"){ clearSel(); fullRender(); return; }
    const objs=selObjs(); if(!objs.length) return;
    if(e.key==="Delete"||e.key==="Backspace"){ deleteSel(); e.preventDefault(); return; }
    const step=e.shiftKey?10:1; let dx=0,dy=0;
    if(e.key==="ArrowLeft")dx=-step; else if(e.key==="ArrowRight")dx=step;
    else if(e.key==="ArrowUp")dy=-step; else if(e.key==="ArrowDown")dy=step; else return;
    for(const o of objs) translateObj(o,dx,dy); fullRender(); e.preventDefault();
  });

  // ---------- layer ops ----------
  function deleteSel(){
    state.objects=state.objects.filter(o=>!isSel(o.id)); clearSel(); fullRender();
  }
  function duplicateSel(){
    const objs=selObjs(); if(!objs.length) return; const newIds=[];
    for(const o of objs){ const c=JSON.parse(JSON.stringify(o)); c.id=uid();
      translateObj(c,6,6); const i=state.objects.findIndex(x=>x.id===o.id);
      state.objects.splice(i+1,0,c); newIds.push(c.id); }
    state.selected=newIds; fullRender();
  }
  function moveZ(dir){ // single selection only
    if(state.selected.length!==1) return;
    const i=state.objects.findIndex(o=>o.id===state.selected[0]); const j=i+dir;
    if(i<0||j<0||j>=state.objects.length) return;
    [state.objects[i],state.objects[j]]=[state.objects[j],state.objects[i]]; fullRender();
  }
  $("delBtn").onclick=deleteSel; $("dupBtn").onclick=duplicateSel;
  $("upBtn").onclick=()=>moveZ(1); $("downBtn").onclick=()=>moveZ(-1);
  document.querySelectorAll("[data-add]").forEach(b=>b.addEventListener("click",()=>{ if(state.penMode) setPen(false); addObject(b.dataset.add); }));

  // ---------- canvas + zoom ----------
  function setCanvas(w,h){ state.canvas.w=clamp(Math.round(w),1,8000); state.canvas.h=clamp(Math.round(h),1,8000);
    $("cw").value=state.canvas.w; $("ch").value=state.canvas.h; fullRender(); }
  $("presetSel").addEventListener("change",e=>{ const v=e.target.value; if(v==="custom") return;
    const [w,h]=v.split("x").map(Number); setCanvas(w,h); fitZoom(); });
  $("cw").addEventListener("change",()=>{ $("presetSel").value="custom"; setCanvas(+$("cw").value,state.canvas.h); });
  $("ch").addEventListener("change",()=>{ $("presetSel").value="custom"; setCanvas(state.canvas.w,+$("ch").value); });
  $("gridChk").addEventListener("change",e=>{ state.grid=e.target.checked; fullRender(); });
  function setZoom(z){ state.zoom=clamp(z,0.1,40); fullRender(); }
  $("zoomIn").onclick=()=>setZoom(state.zoom*1.25); $("zoomOut").onclick=()=>setZoom(state.zoom/1.25);
  function fitZoom(){ const wrap=$("stageWrap").getBoundingClientRect();
    setZoom(clamp(Math.min((wrap.width-60)/state.canvas.w,(wrap.height-60)/state.canvas.h),0.1,40)); }
  $("zoomFit").onclick=fitZoom;

  // ---------- fonts ----------
  $("fontBtn").onclick=()=>$("fontInput").click();
  $("fontInput").addEventListener("change",e=>{ const file=e.target.files[0]; if(!file) return;
    const r=new FileReader();
    r.onload=async()=>{ const dataUrl=r.result;
      const name=file.name.replace(/\.[^.]+$/,"").replace(/[^A-Za-z0-9_-]/g,"_")||("font"+uid());
      try{ const face=new FontFace(name,`url(${dataUrl})`); await face.load(); document.fonts.add(face); }
      catch(err){ alert("Could not load that font file."); return; }
      state.fonts.push({name,dataUrl});
      const o=getSel(); if(o&&o.type==="text") o.fontFamily=name;
      panelKey=""; fullRender(); };
    r.readAsDataURL(file); e.target.value=""; });

  // ---------- import SVG ----------
  function rewriteIds(root,prefix){
    const map={};
    root.querySelectorAll("[id]").forEach(el=>{ const old=el.id, nw=prefix+old; map[old]=nw; el.id=nw; });
    const all=root.querySelectorAll("*"); const refAttrs=["fill","stroke","filter","clip-path","mask","href"];
    all.forEach(el=>{ refAttrs.forEach(a=>{ let val=el.getAttribute(a); if(!val) return;
        for(const old in map){ val=val.split(`#${old})`).join(`#${map[old]})`).split(`#${old}"`).join(`#${map[old]}"`);
          if(val===`#${old}`) val=`#${map[old]}`; }
        el.setAttribute(a,val); });
      let xl=el.getAttributeNS("http://www.w3.org/1999/xlink","href");
      if(xl&&xl[0]==="#"&&map[xl.slice(1)]) el.setAttributeNS("http://www.w3.org/1999/xlink","href","#"+map[xl.slice(1)]);
    });
  }
  $("importBtn").onclick=()=>$("importInput").click();
  $("importInput").addEventListener("change",e=>{ const file=e.target.files[0]; if(!file) return;
    const r=new FileReader();
    r.onload=()=>{ try{
        const doc=new DOMParser().parseFromString(r.result,"image/svg+xml");
        const root=doc.querySelector("svg");
        if(!root) throw new Error("no <svg> root");
        let vbW,vbH; const vb=root.getAttribute("viewBox");
        if(vb){ const n=vb.split(/[ ,]+/).map(Number); vbW=n[2]; vbH=n[3]; }
        if(!vbW||!vbH){ vbW=parseFloat(root.getAttribute("width"))||100; vbH=parseFloat(root.getAttribute("height"))||100; }
        rewriteIds(root,`imp${state.importSeq++}_`);
        let src=""; root.childNodes.forEach(n=>{ src+= n.nodeType===1?n.outerHTML : (n.nodeType===3?n.textContent:""); });
        const o={ id:uid(), type:"svggroup", x:0, y:0, w:vbW, h:vbH, rotation:0, opacity:1, src, vbW, vbH };
        state.objects.push(o); selectOnly(o.id); fullRender();
      }catch(err){ alert("Could not import SVG: "+err.message); } };
    r.readAsText(file); e.target.value=""; });

  // ---------- export ----------
  function buildExportSVG(){
    const clone=stage.cloneNode(true);
    clone.querySelectorAll('[data-editor="1"],[data-hit="1"],[data-empty="1"]').forEach(n=>n.remove());
    clone.querySelectorAll("[data-id]").forEach(n=>n.removeAttribute("data-id"));
    clone.querySelectorAll("[pointer-events]").forEach(n=>n.removeAttribute("pointer-events"));
    clone.removeAttribute("style");
    clone.setAttribute("xmlns",NS); clone.setAttribute("xmlns:xlink","http://www.w3.org/1999/xlink");
    clone.setAttribute("width",state.canvas.w); clone.setAttribute("height",state.canvas.h);
    clone.setAttribute("viewBox",`0 0 ${state.canvas.w} ${state.canvas.h}`);
    const used=new Set(state.objects.filter(o=>o.type==="text").map(o=>o.fontFamily));
    const faces=state.fonts.filter(f=>used.has(f.name));
    if(faces.length){
      const css=faces.map(f=>`@font-face{font-family:'${f.name}';src:url(${f.dataUrl});}`).join("\n");
      const style=document.createElementNS(NS,"style"); style.textContent=css;
      let defs=clone.querySelector("defs");
      if(!defs){ defs=document.createElementNS(NS,"defs"); clone.insertBefore(defs,clone.firstChild); }
      defs.insertBefore(style,defs.firstChild);
    }
    return '<?xml version="1.0" encoding="UTF-8"?>\n'+new XMLSerializer().serializeToString(clone);
  }
  function downloadBlob(blob,name){ const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(url),1000); }
  $("exportSvg").onclick=()=>downloadBlob(new Blob([buildExportSVG()],{type:"image/svg+xml"}),`logo_${state.canvas.w}x${state.canvas.h}.svg`);
  $("exportPng").onclick=()=>{
    const scale=parseInt($("pngScale").value,10);
    const tw=state.canvas.w*scale, th=state.canvas.h*scale, ss=2;
    const url=URL.createObjectURL(new Blob([buildExportSVG()],{type:"image/svg+xml;charset=utf-8"}));
    const img=new Image();
    img.onload=()=>{ const big=document.createElement("canvas"); big.width=tw*ss; big.height=th*ss;
      big.getContext("2d").drawImage(img,0,0,big.width,big.height);
      const out=document.createElement("canvas"); out.width=tw; out.height=th;
      const c=out.getContext("2d"); c.imageSmoothingEnabled=true; c.imageSmoothingQuality="high"; c.drawImage(big,0,0,tw,th);
      out.toBlob(b=>{ downloadBlob(b,`logo_${tw}x${th}.png`); URL.revokeObjectURL(url); },"image/png"); };
    img.onerror=()=>{ alert("PNG render failed. If you used a custom font, try re-uploading it."); URL.revokeObjectURL(url); };
    img.src=url;
  };

  // ---------- project save / load ----------
  $("saveBtn").onclick=()=>downloadBlob(new Blob([JSON.stringify(
    {version:2,canvas:state.canvas,objects:state.objects,fonts:state.fonts,nextId:state.nextId,importSeq:state.importSeq},null,2)],
    {type:"application/json"}),"svgforge_project.json");
  $("loadBtn").onclick=()=>$("loadInput").click();
  $("loadInput").addEventListener("change",e=>{ const file=e.target.files[0]; if(!file) return;
    const r=new FileReader();
    r.onload=async()=>{ try{ const d=JSON.parse(r.result);
        if(!d.canvas||!Array.isArray(d.objects)) throw new Error("bad file");
        state.canvas=d.canvas; state.objects=d.objects; state.fonts=Array.isArray(d.fonts)?d.fonts:[];
        state.nextId=d.nextId||(Math.max(0,...state.objects.map(o=>o.id))+1);
        state.importSeq=d.importSeq||1; clearSel(); panelKey="";
        for(const f of state.fonts){ try{ const face=new FontFace(f.name,`url(${f.dataUrl})`); await face.load(); document.fonts.add(face);}catch(_){} }
        $("cw").value=state.canvas.w; $("ch").value=state.canvas.h; $("presetSel").value="custom"; fitZoom();
      }catch(err){ alert("Could not load project: "+err.message); } };
    r.readAsText(file); e.target.value=""; });

  // ---------- boot ----------
  (function seed(){
    const hex=defaultObject("hexagon");
    hex.fillMode="none"; hex.stroke="#22d3ee"; hex.strokeWidth=2.2; hex.glow=true;
    hex.x=10; hex.y=6; hex.w=46; hex.h=52; state.objects.push(hex);
    const t=defaultObject("text"); t.text="watcher"; t.x=66; t.y=34; t.fontSize=18; t.glow=true;
    state.objects.push(t); selectOnly(t.id);
  })();
  fullRender(); fitZoom();
})();
</script>
</body>
</html>
