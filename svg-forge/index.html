<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVG Forge — offline logo &amp; icon maker</title>
<style>
  :root{
    --bg:#0d0f12; --panel:#16191f; --panel2:#12151b; --line:#2a2f3a;
    --text:#cbd2dc; --dim:#8b919e; --bright:#e6e9ef;
    --cyan:#22d3ee; --green:#4ade80;
    --mono: "SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg); color:var(--text); font-family:var(--mono);
    font-size:13px; display:flex; flex-direction:column; overflow:hidden}
  h2{font-family:var(--mono); letter-spacing:.18em; text-transform:uppercase}
  header{display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding:8px 12px; border-bottom:1px solid var(--line); background:var(--panel2)}
  .brand{font-size:14px; font-weight:bold; color:var(--bright); letter-spacing:.22em}
  .brand b{background:linear-gradient(120deg,var(--cyan),var(--green));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent}
  .bar-group{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
  .sep{width:1px; height:22px; background:var(--line)}
  label.lbl{color:var(--dim); font-size:11px; letter-spacing:.1em; text-transform:uppercase}
  button, select, input{font-family:var(--mono); font-size:12px; color:var(--text);
    background:var(--panel); border:1px solid var(--line); border-radius:5px;
    padding:5px 9px; cursor:pointer; transition:border-color .12s, color .12s}
  button:hover, select:hover{border-color:var(--cyan); color:var(--bright)}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.4; cursor:default}
  button.primary{border-color:#244; color:var(--cyan)}
  button.primary:hover{border-color:var(--cyan); box-shadow:0 0 10px rgba(34,211,238,.25)}
  button.on{border-color:var(--green); color:var(--green); box-shadow:0 0 8px rgba(74,222,128,.3)}
  input{cursor:text}
  input[type=number]{width:58px}
  input[type=color]{padding:2px; width:34px; height:28px; cursor:pointer}
  input[type=checkbox]{width:14px;height:14px;accent-color:var(--green);cursor:pointer}
  input:focus, select:focus, button:focus-visible{outline:2px solid var(--cyan); outline-offset:1px}
  main{flex:1; display:grid; grid-template-columns:212px 1fr 252px; min-height:0}
  .col{overflow-y:auto; padding:12px}
  .col.left{border-right:1px solid var(--line); background:var(--panel2)}
  .col.right{border-left:1px solid var(--line); background:var(--panel2)}
  .stage-wrap{display:flex; align-items:center; justify-content:center; overflow:auto; padding:24px;
    background:radial-gradient(circle at 50% 0%, rgba(34,211,238,.05), transparent 60%), var(--bg)}
  .stage-canvas{--c1:#13191b; --c2:#0d1113; background-color:var(--c2);
    background-image:linear-gradient(45deg,var(--c1) 25%,transparent 25%),
      linear-gradient(-45deg,var(--c1) 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,var(--c1) 75%),
      linear-gradient(-45deg,transparent 75%,var(--c1) 75%);
    background-size:16px 16px; background-position:0 0,0 8px,8px -8px,-8px 0;
    box-shadow:0 0 0 1px var(--line), 0 12px 40px rgba(0,0,0,.5); line-height:0}
  .stage-canvas.solid-dark{background:#0c0c0c; background-image:none}
  .stage-canvas.solid-light{background:#eef1f0; background-image:none}
  svg#stage{display:block; touch-action:none}
  .panel-title{color:var(--cyan); font-size:11px; margin:0 0 10px; letter-spacing:.2em}
  .field{display:flex; align-items:center; justify-content:space-between; gap:8px; margin:7px 0}
  .field > label{color:var(--dim); font-size:11px; white-space:nowrap}
  .field input[type=text]{width:100%}
  .hint{color:var(--dim); font-size:11px; line-height:1.5; margin:8px 0 0}
  .layer{display:flex; align-items:center; gap:6px; padding:6px 7px; margin:3px 0;
    border:1px solid transparent; border-radius:5px; cursor:pointer; background:var(--panel)}
  .layer:hover{border-color:var(--line)}
  .layer.sel{border-color:var(--cyan); color:var(--bright); box-shadow:inset 0 0 0 1px rgba(34,211,238,.2)}
  .layer .tag{font-size:10px; color:var(--dim); text-transform:uppercase}
  .layer .nm{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .layer-actions{display:flex; gap:4px; margin-top:8px}
  .layer-actions button{flex:1; padding:5px 0; font-size:11px}
  .add-grid{display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:6px}
  .add-grid button{padding:8px 4px}
  .wide{width:100%; margin-top:6px}
  .empty{color:var(--dim); font-size:11px; padding:10px 4px; line-height:1.5}
  .align-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:4px; margin:4px 0 10px}
  .align-grid button{padding:6px 0; font-size:13px}
  .tile-form{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:6px}
  .tile-form label{display:flex; flex-direction:column; gap:3px; font-size:10px; color:var(--dim); text-transform:uppercase}
  .tile-form input{width:100%}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#1c2629;border-radius:6px}
  ::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<header>
  <span class="brand">SVG&nbsp;<b>FORGE</b></span>
  <div class="sep"></div>
  <div class="bar-group">
    <label class="lbl">Canvas</label>
    <select id="presetSel" title="Canvas size preset">
      <option value="190x64">190 × 64  (GDM logo)</option>
      <option value="380x128">380 × 128</option>
      <option value="759x256">759 × 256</option>
      <option value="64x64">64 × 64  (icon)</option>
      <option value="128x128">128 × 128</option>
      <option value="256x256">256 × 256</option>
      <option value="512x512">512 × 512</option>
      <option value="custom">custom…</option>
    </select>
    <input type="number" id="cw" min="1" max="8000" value="190" title="Canvas width">
    <input type="number" id="ch" min="1" max="8000" value="64" title="Canvas height">
  </div>
  <div class="sep"></div>
  <div class="bar-group">
    <button id="undoBtn" title="Undo (Ctrl/Cmd+Z)">↶</button>
    <button id="redoBtn" title="Redo (Ctrl/Cmd+Shift+Z)">↷</button>
  </div>
  <div class="sep"></div>
  <div class="bar-group">
    <label class="lbl">Zoom</label>
    <button id="zoomOut">−</button>
    <span id="zoomVal" style="min-width:42px;text-align:center;color:var(--dim)">100%</span>
    <button id="zoomIn">+</button>
    <button id="zoomFit">fit</button>
    <label class="lbl" style="margin-left:4px"><input type="checkbox" id="gridChk"> grid</label>
    <label class="lbl"><input type="checkbox" id="snapChk" checked> snap</label>
    <button id="bgBtn" title="Cycle preview background">bg: checker</button>
  </div>
  <div class="sep"></div>
  <div class="bar-group">
    <button id="importBtn" title="Import an .svg file as an element">↑ SVG</button>
    <input type="file" id="importInput" accept=".svg,image/svg+xml" hidden>
    <button id="imgBtn" title="Load a raster image as a tracing reference (never exported)">↑ image</button>
    <input type="file" id="imgInput" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp,image/*" hidden>
    <button id="fontBtn" title="Upload a .ttf / .otf / .woff font">↑ font</button>
    <input type="file" id="fontInput" accept=".ttf,.otf,.woff,.woff2,font/*" hidden>
    <button id="saveBtn">save</button>
    <button id="loadBtn">load</button>
    <input type="file" id="loadInput" accept=".json,application/json" hidden>
  </div>
  <div class="sep"></div>
  <div class="bar-group">
    <button class="primary" id="exportSvg">⤓ SVG</button>
    <label class="lbl"><input type="checkbox" id="outlineChk"> outline text</label>
    <label class="lbl">PNG&nbsp;×</label>
    <select id="pngScale" title="PNG export scale">
      <option value="1">1×</option><option value="2">2×</option>
      <option value="4" selected>4×</option><option value="8">8×</option>
    </select>
    <button class="primary" id="exportPng">⤓ PNG</button>
    <button class="primary" id="exportZip" title="All sizes (1–8×) + SVG as a .zip">⤓ all</button>
  </div>
</header>

<main>
  <section class="col left">
    <h2 class="panel-title">Add element</h2>
    <div class="add-grid">
      <button data-add="rect">▭ Rect</button>
      <button data-add="ellipse">◯ Ellipse</button>
      <button data-add="triangle">△ Triangle</button>
      <button data-add="hexagon">⬡ Hexagon</button>
      <button data-add="star">★ Star</button>
      <button data-add="text">T Text</button>
    </div>
    <button data-add="line" class="wide">— Line</button>
    <button id="penBtn" class="wide" title="Click to place points; Enter or double-click to finish, Esc to cancel">✎ Pen (freeform)</button>

    <h2 class="panel-title" style="margin-top:20px">Layers</h2>
    <div id="layers"></div>
    <div class="layer-actions">
      <button id="dupBtn" title="Duplicate">dup</button>
      <button id="upBtn" title="Bring forward">↑</button>
      <button id="downBtn" title="Send back">↓</button>
      <button id="delBtn" title="Delete">del</button>
    </div>

    <h2 class="panel-title" style="margin-top:18px">Tile selection</h2>
    <div class="tile-form">
      <label>cols<input type="number" id="tileCols" min="1" max="50" value="3"></label>
      <label>rows<input type="number" id="tileRows" min="1" max="50" value="1"></label>
      <label>gap<input type="number" id="tileGap" value="8"></label>
    </div>
    <button id="tileBtn" class="wide">Tile selection →</button>

    <p class="hint">Drag to move. Shift-click or drag a box to multi-select. Arrows nudge (Shift ×10). Delete removes.</p>
  </section>

  <section class="stage-wrap" id="stageWrap">
    <div class="stage-canvas" id="stageCanvas">
      <svg id="stage" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </section>

  <section class="col right">
    <h2 class="panel-title">Properties</h2>
    <div id="props"><div class="empty">Nothing selected. Add an element or pick a layer.</div></div>
  </section>
</main>

          }
    
          if (Q.at(0, 0)>Q.at(1, 1)) {
            v[0] = -Q.at(0, 1);
            v[1] = Q.at(0, 0);
          } else if (Q.at(1, 1)) {
            v[0] = -Q.at(1, 1);
            v[1] = Q.at(1, 0);
          } else {
            v[0] = 1;
            v[1] = 0;
          }
          d = v[0] * v[0] + v[1] * v[1];
          v[2] = - v[1] * s.y - v[0] * s.x;
          for (l=0; l<3; l++) {
            for (k=0; k<3; k++) {
              Q.data[l * 3 + k] += v[l] * v[k] / d;
            }
          }
        }
        dx = Math.abs(w.x-s.x);
        dy = Math.abs(w.y-s.y);
        if (dx <= 0.5 && dy <= 0.5) {
          path.curve.vertex[i] = new Point(w.x+x0, w.y+y0);
          continue;
        }
    
        min = quadform(Q, s);
        xmin = s.x;
        ymin = s.y;
    
        if (Q.at(0, 0) !== 0.0) {
          for (z=0; z<2; z++) {
            w.y = s.y-0.5+z;
            w.x = - (Q.at(0, 1) * w.y + Q.at(0, 2)) / Q.at(0, 0);
            dx = Math.abs(w.x-s.x);
            cand = quadform(Q, w);
            if (dx <= 0.5 && cand < min) {
              min = cand;
              xmin = w.x;
              ymin = w.y;
            }
          }
        }
  
        if (Q.at(1, 1) !== 0.0) {
          for (z=0; z<2; z++) {
            w.x = s.x-0.5+z;
            w.y = - (Q.at(1, 0) * w.x + Q.at(1, 2)) / Q.at(1, 1);
            dy = Math.abs(w.y-s.y);
            cand = quadform(Q, w);
            if (dy <= 0.5 && cand < min) {
              min = cand;
              xmin = w.x;
              ymin = w.y;
            }
          }
        }
  
        for (l=0; l<2; l++) {
          for (k=0; k<2; k++) {
            w.x = s.x-0.5+l;
            w.y = s.y-0.5+k;
            cand = quadform(Q, w);
            if (cand < min) {
              min = cand;
              xmin = w.x;
              ymin = w.y;
            }
          }
        }
    
        path.curve.vertex[i] = new Point(xmin + x0, ymin + y0);
      }
    }
    
    function reverse(path) {
      var curve = path.curve, m = curve.n, v = curve.vertex, i, j, tmp;
    
      for (i=0, j=m-1; i<j; i++, j--) {
        tmp = v[i];
        v[i] = v[j];
        v[j] = tmp;
      }
    }
    
    function smooth(path) {
      var m = path.curve.n, curve = path.curve;

      var i, j, k, dd, denom, alpha,
        p2, p3, p4;
    
      for (i=0; i<m; i++) {
        j = mod(i+1, m);
        k = mod(i+2, m);
        p4 = interval(1/2.0, curve.vertex[k], curve.vertex[j]);
    
        denom = ddenom(curve.vertex[i], curve.vertex[k]);
        if (denom !== 0.0) {
          dd = dpara(curve.vertex[i], curve.vertex[j], curve.vertex[k]) / denom;
          dd = Math.abs(dd);
          alpha = dd>1 ? (1 - 1.0/dd) : 0;
          alpha = alpha / 0.75;
        } else {
          alpha = 4/3.0;
        }
        curve.alpha0[j] = alpha;
    
        if (alpha >= info.alphamax) { 
          curve.tag[j] = "CORNER";
          curve.c[3 * j + 1] = curve.vertex[j];
          curve.c[3 * j + 2] = p4;
        } else {
          if (alpha < 0.55) {
            alpha = 0.55;
          } else if (alpha > 1) {
            alpha = 1;
          }
          p2 = interval(0.5+0.5*alpha, curve.vertex[i], curve.vertex[j]);
          p3 = interval(0.5+0.5*alpha, curve.vertex[k], curve.vertex[j]);
          curve.tag[j] = "CURVE";
          curve.c[3 * j + 0] = p2;
          curve.c[3 * j + 1] = p3;
          curve.c[3 * j + 2] = p4;
        }
        curve.alpha[j] = alpha;  
        curve.beta[j] = 0.5;
      }
      curve.alphacurve = 1;
    }
    
    function optiCurve(path) {
      function Opti(){
        this.pen = 0;
        this.c = [new Point(), new Point()];
        this.t = 0;
        this.s = 0;
        this.alpha = 0;
      }
      
      function opti_penalty(path, i, j, res, opttolerance, convc, areac) {
        var m = path.curve.n, curve = path.curve, vertex = curve.vertex, 
          k, k1, k2, conv, i1,
          area, alpha, d, d1, d2,
          p0, p1, p2, p3, pt,
          A, R, A1, A2, A3, A4,
          s, t;
      
        if (i==j) {
          return 1;
        }
      
        k = i;
        i1 = mod(i+1, m);
        k1 = mod(k+1, m);
        conv = convc[k1];
        if (conv === 0) {
          return 1;
        }
        d = ddist(vertex[i], vertex[i1]);
        for (k=k1; k!=j; k=k1) {
          k1 = mod(k+1, m);
          k2 = mod(k+2, m);
          if (convc[k1] != conv) {
            return 1;
          }
          if (sign(cprod(vertex[i], vertex[i1], vertex[k1], vertex[k2])) !=
              conv) {
            return 1;
          }
          if (iprod1(vertex[i], vertex[i1], vertex[k1], vertex[k2]) <
              d * ddist(vertex[k1], vertex[k2]) * -0.999847695156) {
            return 1;
          }
        }
    
        p0 = curve.c[mod(i,m) * 3 + 2].copy();
        p1 = vertex[mod(i+1,m)].copy();
        p2 = vertex[mod(j,m)].copy();
        p3 = curve.c[mod(j,m) * 3 + 2].copy();
      
        area = areac[j] - areac[i];
        area -= dpara(vertex[0], curve.c[i * 3 + 2], curve.c[j * 3 + 2])/2;
        if (i>=j) {
          area += areac[m];
        }
      
        A1 = dpara(p0, p1, p2);
        A2 = dpara(p0, p1, p3);
        A3 = dpara(p0, p2, p3);
  
        A4 = A1+A3-A2;    
        
        if (A2 == A1) {
          return 1;
        }
      
        t = A3/(A3-A4);
        s = A2/(A2-A1);
        A = A2 * t / 2.0;
        
        if (A === 0.0) {
          return 1;
        }
      
        R = area / A;
        alpha = 2 - Math.sqrt(4 - R / 0.3);
      
        res.c[0] = interval(t * alpha, p0, p1);
        res.c[1] = interval(s * alpha, p3, p2);
        res.alpha = alpha;
        res.t = t;
        res.s = s;
      
        p1 = res.c[0].copy();
        p2 = res.c[1].copy(); 
      
        res.pen = 0;
      
        for (k=mod(i+1,m); k!=j; k=k1) {
          k1 = mod(k+1,m);
          t = tangent(p0, p1, p2, p3, vertex[k], vertex[k1]);
          if (t<-0.5) {
            return 1;
          }
          pt = bezier(t, p0, p1, p2, p3);
          d = ddist(vertex[k], vertex[k1]);
          if (d === 0.0) {
            return 1;
          }
          d1 = dpara(vertex[k], vertex[k1], pt) / d;
          if (Math.abs(d1) > opttolerance) {
            return 1;
          }
          if (iprod(vertex[k], vertex[k1], pt) < 0 ||
              iprod(vertex[k1], vertex[k], pt) < 0) {
            return 1;
          }
          res.pen += d1 * d1;
        }
      
        for (k=i; k!=j; k=k1) {
          k1 = mod(k+1,m);
          t = tangent(p0, p1, p2, p3, curve.c[k * 3 + 2], curve.c[k1 * 3 + 2]);
          if (t<-0.5) {
            return 1;
          }
          pt = bezier(t, p0, p1, p2, p3);
          d = ddist(curve.c[k * 3 + 2], curve.c[k1 * 3 + 2]);
          if (d === 0.0) {
            return 1;
          }
          d1 = dpara(curve.c[k * 3 + 2], curve.c[k1 * 3 + 2], pt) / d;
          d2 = dpara(curve.c[k * 3 + 2], curve.c[k1 * 3 + 2], vertex[k1]) / d;
          d2 *= 0.75 * curve.alpha[k1];
          if (d2 < 0) {
            d1 = -d1;
            d2 = -d2;
          }
          if (d1 < d2 - opttolerance) {
            return 1;
          }
          if (d1 < d2) {
            res.pen += (d1 - d2) * (d1 - d2);
          }
        }
      
        return 0;
      }
    
      var curve = path.curve, m = curve.n, vert = curve.vertex, 
        pt = new Array(m + 1),
        pen = new Array(m + 1),
        len = new Array(m + 1),
        opt = new Array(m + 1),
        om, i,j,r,
        o = new Opti(), p0,
        i1, area, alpha, ocurve,
        s, t;
      
      var convc = new Array(m), areac = new Array(m + 1);
      
      for (i=0; i<m; i++) {
        if (curve.tag[i] == "CURVE") {
          convc[i] = sign(dpara(vert[mod(i-1,m)], vert[i], vert[mod(i+1,m)]));
        } else {
          convc[i] = 0;
        }
      }
    
      area = 0.0;
      areac[0] = 0.0;
      p0 = curve.vertex[0];
      for (i=0; i<m; i++) {
        i1 = mod(i+1, m);
        if (curve.tag[i1] == "CURVE") {
          alpha = curve.alpha[i1];
          area += 0.3 * alpha * (4-alpha) *
              dpara(curve.c[i * 3 + 2], vert[i1], curve.c[i1 * 3 + 2])/2;
          area += dpara(p0, curve.c[i * 3 + 2], curve.c[i1 * 3 + 2])/2;
        }
        areac[i+1] = area;
      }
    
      pt[0] = -1;
      pen[0] = 0;
      len[0] = 0;
    
    
      for (j=1; j<=m; j++) {
        pt[j] = j-1;
        pen[j] = pen[j-1];
        len[j] = len[j-1]+1;
    
        for (i=j-2; i>=0; i--) {
          r = opti_penalty(path, i, mod(j,m), o, info.opttolerance, convc, 
              areac);
          if (r) {
            break;
          }
            if (len[j] > len[i]+1 ||
                (len[j] == len[i]+1 && pen[j] > pen[i] + o.pen)) {
              pt[j] = i;
              pen[j] = pen[i] + o.pen;
              len[j] = len[i] + 1;
              opt[j] = o;
              o = new Opti();
            }
        }
      }
      om = len[m];
      ocurve = new Curve(om);
      s = new Array(om);
      t = new Array(om);
    
      j = m;
      for (i=om-1; i>=0; i--) {
        if (pt[j]==j-1) {
          ocurve.tag[i]     = curve.tag[mod(j,m)];
          ocurve.c[i * 3 + 0]    = curve.c[mod(j,m) * 3 + 0];
          ocurve.c[i * 3 + 1]    = curve.c[mod(j,m) * 3 + 1];
          ocurve.c[i * 3 + 2]    = curve.c[mod(j,m) * 3 + 2];
          ocurve.vertex[i]  = curve.vertex[mod(j,m)];
          ocurve.alpha[i]   = curve.alpha[mod(j,m)];
          ocurve.alpha0[i]  = curve.alpha0[mod(j,m)];
          ocurve.beta[i]    = curve.beta[mod(j,m)];
          s[i] = t[i] = 1.0;
        } else {
          ocurve.tag[i] = "CURVE";
          ocurve.c[i * 3 + 0] = opt[j].c[0];
          ocurve.c[i * 3 + 1] = opt[j].c[1];
          ocurve.c[i * 3 + 2] = curve.c[mod(j,m) * 3 + 2];
          ocurve.vertex[i] = interval(opt[j].s, curve.c[mod(j,m) * 3 + 2],
                                       vert[mod(j,m)]);
          ocurve.alpha[i] = opt[j].alpha;
          ocurve.alpha0[i] = opt[j].alpha;
          s[i] = opt[j].s;
          t[i] = opt[j].t;
        }
        j = pt[j];
      }
    
      for (i=0; i<om; i++) {
        i1 = mod(i+1,om);
        ocurve.beta[i] = s[i] / (s[i] + t[i1]);
      }
      ocurve.alphacurve = 1;
      path.curve = ocurve;
    }
    
    for (var i = 0; i < pathlist.length; i++) {
      var path = pathlist[i];
      calcSums(path);
      calcLon(path);
      bestPolygon(path);
      adjustVertices(path);
      
      if (path.sign === "-") {
        reverse(path);
      }
      
      smooth(path);
      
      if (info.optcurve) {
        optiCurve(path);
      }
    }
  
  }

  function process(c) {
    if (c) {
      callback = c;
    }
    if (!info.isReady) {
      setTimeout(process, 100);
      return;
    }
    bmToPathlist();
    processPath();
    callback();
    callback = null;
  }

  function clear() {
    bm = null;
    pathlist = [];
    callback = null;
    info.isReady = false;
  }
  
  function getSVG(size, opt_type) {
  
    function path(curve) {
    
      function bezier(i) {
        var b = 'C ' + (curve.c[i * 3 + 0].x * size).toFixed(3) + ' ' +
            (curve.c[i * 3 + 0].y * size).toFixed(3) + ',';
        b += (curve.c[i * 3 + 1].x * size).toFixed(3) + ' ' +
            (curve.c[i * 3 + 1].y * size).toFixed(3) + ',';
        b += (curve.c[i * 3 + 2].x * size).toFixed(3) + ' ' +
            (curve.c[i * 3 + 2].y * size).toFixed(3) + ' ';
        return b;
      }
    
      function segment(i) {
        var s = 'L ' + (curve.c[i * 3 + 1].x * size).toFixed(3) + ' ' +
            (curve.c[i * 3 + 1].y * size).toFixed(3) + ' ';
        s += (curve.c[i * 3 + 2].x * size).toFixed(3) + ' ' +
            (curve.c[i * 3 + 2].y * size).toFixed(3) + ' ';
        return s;
      }

      var n = curve.n, i;
      var p = 'M' + (curve.c[(n - 1) * 3 + 2].x * size).toFixed(3) +
          ' ' + (curve.c[(n - 1) * 3 + 2].y * size).toFixed(3) + ' ';
      for (i = 0; i < n; i++) {
        if (curve.tag[i] === "CURVE") {
          p += bezier(i);
        } else if (curve.tag[i] === "CORNER") {
          p += segment(i);
        }
      }
      //p += 
      return p;
    }

    var w = bm.w * size, h = bm.h * size,
      len = pathlist.length, c, i, strokec, fillc, fillrule;

    var svg = '<svg id="svg" version="1.1" width="' + w + '" height="' + h +
        '" xmlns="http://www.w3.org/2000/svg">';
    svg += '<path d="';
    for (i = 0; i < len; i++) {
      c = pathlist[i].curve;
      svg += path(c);
    }
    if (opt_type === "curve") {
      strokec = "black";
      fillc = "none";
      fillrule = '';
    } else {
      strokec = "none";
      fillc = "black";
      fillrule = ' fill-rule="evenodd"';
    }
    svg += '" stroke="' + strokec + '" fill="' + fillc + '"' + fillrule + '/></svg>';
    return svg;
  }
  
  return{
    loadImageFromFile: loadImageFromFile,
    loadImageFromUrl: loadImageFromUrl,
    setParameter: setParameter,
    process: process,
    getSVG: getSVG,
    img: imgElement
  };
})();

<script>

(function(){

  const clearSel=()=>{ state.selected=[]; };

  function restoreSnap(s){ const d=JSON.parse(s);
    state.canvas=d.canvas; state.objects=d.objects; state.selected=d.selected||[];
    state.nextId=d.nextId; state.importSeq=d.importSeq; panelKey=""; }
  function commitInit(){ history.length=0; history.push(snapshot()); histIdx=0; updateUndoButtons(); }
  function commit(){
    const s=snapshot();
    if(histIdx>=0 && history[histIdx]===s) return;
    history.splice(histIdx+1);
    history.push(s);
    while(history.length>150) history.shift();
    histIdx=history.length-1;
    updateUndoButtons();
  }
  function scheduleCommit(){ clearTimeout(commitTimer); commitTimer=setTimeout(commit,350); }
  function undo(){ if(histIdx>0){ clearTimeout(commitTimer); histIdx--; restoreSnap(history[histIdx]); updateUndoButtons(); fullRender(); } }
  function redo(){ if(histIdx<history.length-1){ histIdx++; restoreSnap(history[histIdx]); updateUndoButtons(); fullRender(); } }
  function updateUndoButtons(){ $("undoBtn").disabled=histIdx<=0; $("redoBtn").disabled=histIdx>=history.length-1; }

  // ---------- defaults / creation ----------
  function defaultObject(type){

      x:Math.round(c.w*0.30), y:Math.round(c.h*0.30),

      rotation:0, opacity:1, fillMode:"solid", fill:"#22d3ee",

    if(type==="text"){ o.text="watcher"; o.fontFamily="__mono"; o.fontSize=Math.round(c.h*0.4);
      o.fontWeight="bold"; o.letterSpacing=0; o.fillMode="gradient";

  }
  function addObject(type){ const o=defaultObject(type); state.objects.push(o); selectOnly(o.id); commit(); fullRender(); }
  function createPath(nodes,closed){
    const o={ id:uid(), type:"path", nodes, closed, rotation:0, opacity:1,
      fillMode:"none", fill:"#22d3ee", grad:["#22d3ee","#4ade80"], gradAngle:135,
      stroke:"#22d3ee", strokeWidth:2, glow:false, glowStrength:1.1 };
    state.objects.push(o); selectOnly(o.id); commit(); fullRender();
  }

  // ---------- geometry ----------
  function polyPoints(type,o){
    const {x,y,w,h}=o;
    const map=pts=>pts.map(p=>`${(x+p[0]*w).toFixed(2)},${(y+p[1]*h).toFixed(2)}`).join(" ");
    if(type==="triangle") return map([[0.5,0],[1,1],[0,1]]);
    if(type==="hexagon")  return map([[0.5,0],[1,0.25],[1,0.75],[0.5,1],[0,0.75],[0,0.25]]);
    if(type==="star"){ const pts=[],cx=0.5,cy=0.5,oR=0.5,iR=0.22;
      for(let i=0;i<10;i++){ const r=(i%2===0)?oR:iR, a=(-90+i*36)*Math.PI/180;
        pts.push([cx+r*Math.cos(a), cy+r*Math.sin(a)]); }
      return map(pts); }
    return "";
  }
  function pathD(o){ const N=o.nodes; if(!N||!N.length) return "";
    const f=n=>n.toFixed(2);
    const seg=(a,b)=>{ const c1=a.hOut, c2=b.hIn;
      if(c1||c2){ const x1=a.x+(c1?c1[0]:0), y1=a.y+(c1?c1[1]:0), x2=b.x+(c2?c2[0]:0), y2=b.y+(c2?c2[1]:0);
        return ` C ${f(x1)} ${f(y1)} ${f(x2)} ${f(y2)} ${f(b.x)} ${f(b.y)}`; }
      return ` L ${f(b.x)} ${f(b.y)}`; };
    let d="M "+f(N[0].x)+" "+f(N[0].y);
    for(let i=1;i<N.length;i++) d+=seg(N[i-1],N[i]);
    if(o.closed && N.length>2){ d+=seg(N[N.length-1],N[0]); d+=" Z"; }
    return d; }
  const cloneNodes=ns=>ns.map(n=>({x:n.x,y:n.y,hIn:n.hIn?n.hIn.slice():null,hOut:n.hOut?n.hOut.slice():null}));
  const corner=(x,y)=>({x,y,hIn:null,hOut:null});
  function createImage(src,iw,ih){
    const c=state.canvas, scale=Math.min(c.w/iw,c.h/ih)||1;
    const w=Math.max(1,Math.round(iw*scale)), h=Math.max(1,Math.round(ih*scale));
    const o={ id:uid(), type:"image", x:Math.round((c.w-w)/2), y:Math.round((c.h-h)/2), w, h, rotation:0, opacity:0.4, src, locked:false, hidden:false };
    state.objects.unshift(o); selectOnly(o.id); commit(); fullRender();
  }
  function nodesBbox(nodes){

  function rewriteIds(root,prefix){

  $("imgBtn").onclick=()=>$("imgInput").click();
  $("imgInput").addEventListener("change",e=>{ const file=e.target.files[0]; if(!file) return;
    const r=new FileReader();
    r.onload=()=>{ const src=r.result; const img=new Image();
      img.onload=()=>createImage(src, img.naturalWidth||img.width||100, img.naturalHeight||img.height||100);
      img.onerror=()=>alert("Could not load that image."); img.src=src; };
    r.readAsDataURL(file); e.target.value=""; });

  // ---------- auto-trace (Potrace) ----------
  function parsePathD(d){
    const toks=d.match(/[a-zA-Z]|-?\d*\.?\d+(?:[eE][-+]?\d+)?/g)||[];
    let i=0,cx=0,cy=0,cmd=null,cur=null,prevC=null; const sub=[];
    const num=()=>parseFloat(toks[i++]);
    const isCmd=t=>/^[a-zA-Z]$/.test(t);
    const push=(x,y)=>{ const n={x,y,hIn:null,hOut:null}; cur.nodes.push(n); cx=x; cy=y; prevC=null; return n; };
    function newSub(x,y){ finish(false); cur={nodes:[],closed:false}; sub.push(cur); push(x,y); }
    function finish(z){ if(!cur||cur.nodes.length<2) return; const N=cur.nodes,a=N[0],zz=N[N.length-1];
      if(Math.abs(a.x-zz.x)<0.05&&Math.abs(a.y-zz.y)<0.05&&N.length>2){ a.hIn=zz.hIn; N.pop(); cur.closed=true; } else if(z) cur.closed=true; }
    function cubic(c1x,c1y,c2x,c2y,ex,ey){ const prev=cur.nodes[cur.nodes.length-1]; prev.hOut=[c1x-prev.x,c1y-prev.y]; const n=push(ex,ey); n.hIn=[c2x-ex,c2y-ey]; prevC=[c2x,c2y]; }
    while(i<toks.length){ let t=toks[i];
      if(isCmd(t)){ cmd=t; i++; if(cmd==="Z"||cmd==="z"){ finish(true); cur=null; continue; } }
      if(cmd==null){ i++; continue; }
      const x0=cx,y0=cy;
      switch(cmd){
        case "M": { const x=num(),y=num(); newSub(x,y); cmd="L"; break; }
        case "m": { const x=x0+num(),y=y0+num(); newSub(x,y); cmd="l"; break; }
        case "L": { push(num(),num()); break; }
        case "l": { push(x0+num(),y0+num()); break; }
        case "H": { push(num(),cy); break; }
        case "h": { push(x0+num(),cy); break; }
        case "V": { push(cx,num()); break; }
        case "v": { push(cx,y0+num()); break; }
        case "C": { cubic(num(),num(),num(),num(),num(),num()); break; }
        case "c": { cubic(x0+num(),y0+num(),x0+num(),y0+num(),x0+num(),y0+num()); break; }
        case "S": case "s": { const rel=cmd==="s"; const rx=p=>rel?x0+p:p, ry=p=>rel?y0+p:p;
          const c2x=rx(num()),c2y=ry(num()),ex=rx(num()),ey=ry(num());
          const r=prevC?[2*x0-prevC[0],2*y0-prevC[1]]:[x0,y0]; cubic(r[0],r[1],c2x,c2y,ex,ey); break; }
        case "Q": case "q": { const rel=cmd==="q"; const rx=p=>rel?x0+p:p, ry=p=>rel?y0+p:p;
          const qx=rx(num()),qy=ry(num()),ex=rx(num()),ey=ry(num());
          cubic(x0+2/3*(qx-x0),y0+2/3*(qy-y0), ex+2/3*(qx-ex),ey+2/3*(qy-ey), ex,ey); prevC=[qx,qy]; break; }
        case "T": case "t": { const rel=cmd==="t"; const rx=p=>rel?x0+p:p, ry=p=>rel?y0+p:p;
          const ex=rx(num()),ey=ry(num()); const q=prevC?[2*x0-prevC[0],2*y0-prevC[1]]:[x0,y0];
          cubic(x0+2/3*(q[0]-x0),y0+2/3*(q[1]-y0), ex+2/3*(q[0]-ex),ey+2/3*(q[1]-ey), ex,ey); prevC=q; break; }
        case "A": case "a": { num();num();num();num();num(); const rel=cmd==="a"; const ex=rel?x0+num():num(),ey=rel?y0+num():num(); push(ex,ey); break; }
        default: i++;
      }
    }
    finish(false);
    return sub.filter(s=>s.nodes.length>=2);
  }
  function preprocessBW(srcDataUrl, threshold, invert){
    return new Promise((resolve,reject)=>{ const img=new Image();
      img.onload=()=>{ const w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
        const cv=document.createElement("canvas"); cv.width=w; cv.height=h; const ctx=cv.getContext("2d"); ctx.drawImage(img,0,0);
        let id; try{ id=ctx.getImageData(0,0,w,h); }catch(e){ reject(new Error("Could not read image pixels.")); return; }
        const d=id.data;
        for(let i=0;i<d.length;i+=4){ const a=d[i+3];
          const lum = a===0 ? 255 : (0.2126*d[i]+0.7152*d[i+1]+0.0722*d[i+2]);
          let black = lum < threshold; if(invert) black=!black; const v=black?0:255;
          d[i]=d[i+1]=d[i+2]=v; d[i+3]=255; }
        ctx.putImageData(id,0,0); resolve({url:cv.toDataURL("image/png"), w, h}); };
      img.onerror=()=>reject(new Error("Could not load image for tracing.")); img.src=srcDataUrl; });
  }
  function traceImage(o){
    const P=window.Potrace, status=$("traceStatus");
    if(!P){ if(status) status.textContent="Tracer unavailable."; return; }
    const th=parseInt(($("traceThreshold")||{}).value,10), inv=!!(($("traceInvert")||{}).checked), det=Math.max(0,parseInt(($("traceDetail")||{}).value,10)||0);
    if(status) status.textContent="Tracing…";
    preprocessBW(o.src, isNaN(th)?128:th, inv).then(({url,w,h})=>{
      P.setParameter({turdsize:det, turnpolicy:"minority", optcurve:true, alphamax:1, opttolerance:0.2});
      P.loadImageFromUrl(url);
      P.process(()=>{ try{
        const svg=P.getSVG(1), m=svg.match(/ d="([^"]*)"/);
        const subs=m?parsePathD(m[1]):[];
        if(!subs.length){ if(status) status.textContent="No shapes found — adjust threshold / invert."; return; }
        const sx=o.w/w, sy=o.h/h, ids=[];
        for(const s of subs){
          const nodes=s.nodes.map(n=>({ x:o.x+n.x*sx, y:o.y+n.y*sy,
            hIn:n.hIn?[n.hIn[0]*sx,n.hIn[1]*sy]:null, hOut:n.hOut?[n.hOut[0]*sx,n.hOut[1]*sy]:null }));
          state.objects.push({ id:uid(), type:"path", nodes, closed:true, rotation:0, opacity:1,
            fillMode:"solid", fill:"#22d3ee", grad:["#22d3ee","#4ade80"], gradAngle:135,
            stroke:"#000000", strokeWidth:0, glow:false, glowStrength:1.1 });
          ids.push(state.objects[state.objects.length-1].id);
        }
        o.hidden=true; state.selected=ids; panelKey=""; commit(); fullRender();
      }catch(err){ if(status) status.textContent="Trace failed: "+err.message; } });
    }).catch(err=>{ if(status) status.textContent=err.message; });
  }

  // ---------- export ----------
  function buildExportSVG(){
    const clone=stage.cloneNode(true);
    if($("outlineChk").checked && typeof window.opentype!=="undefined"){
      for(const o of state.objects){ if(o.type!=="text"||o.fontFamily.indexOf("__")===0) continue;
        const d=outlineTextD(o); if(!d) continue;
        const el=clone.querySelector(`[data-id="${o.id}"]`); if(!el) continue;
        const p=document.createElementNS(NS,"path"); p.setAttribute("d",d);
        ["fill","opacity","filter","transform","stroke","stroke-width"].forEach(a=>{ if(el.hasAttribute(a)) p.setAttribute(a,el.getAttribute(a)); });
        el.parentNode.replaceChild(p,el);
      }
    }
    clone.querySelectorAll('[data-editor="1"],[data-hit="1"],[data-empty="1"],[data-ref="1"]').forEach(n=>n.remove());
    clone.querySelectorAll("[data-id]").forEach(n=>n.removeAttribute("data-id"));
    clone.querySelectorAll("[pointer-events]").forEach(n=>n.removeAttribute("pointer-events"));
    clone.removeAttribute("style");
    clone.setAttribute("xmlns",NS); clone.setAttribute("xmlns:xlink","http://www.w3.org/1999/xlink");
    clone.setAttribute("width",state.canvas.w); clone.setAttribute("height",state.canvas.h); clone.setAttribute("viewBox",`0 0 ${state.canvas.w} ${state.canvas.h}`);
    const usedNames=new Set(); clone.querySelectorAll("text").forEach(t=>{ const ff=(t.getAttribute("font-family")||"").replace(/'/g,""); usedNames.add(ff); });
    const faces=state.fonts.filter(f=>usedNames.has(f.name));
    if(faces.length){ const css=faces.map(f=>`@font-face{font-family:'${f.name}';src:url(${f.dataUrl});}`).join("\n");
      const style=document.createElementNS(NS,"style"); style.textContent=css;
      let defs=clone.querySelector("defs"); if(!defs){ defs=document.createElementNS(NS,"defs"); clone.insertBefore(defs,clone.firstChild); }
      defs.insertBefore(style,defs.firstChild); }
    return '<?xml version="1.0" encoding="UTF-8"?>\n'+new XMLSerializer().serializeToString(clone);
  }
  function outlineTextD(o){ const font=getOtFont(o.fontFamily); if(!font) return null;
    const scale=o.fontSize/font.unitsPerEm; let cursor=o.x, d="";
    for(const ch of o.text){ const g=font.charToGlyph(ch); d+=g.getPath(cursor,o.y,o.fontSize).toPathData(2)+" "; cursor+=(g.advanceWidth||0)*scale+(o.letterSpacing||0); }
    return d.trim(); }
  function downloadBlob(blob,name){ const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(url),1500); }
  $("exportSvg").onclick=()=>downloadBlob(new Blob([buildExportSVG()],{type:"image/svg+xml"}),`logo_${state.canvas.w}x${state.canvas.h}.svg`);

  function rasterize(svgStr, tw, th){
    return new Promise((resolve,reject)=>{ const ss=2, url=URL.createObjectURL(new Blob([svgStr],{type:"image/svg+xml;charset=utf-8"})); const img=new Image();
      img.onload=()=>{ const big=document.createElement("canvas"); big.width=tw*ss; big.height=th*ss; big.getContext("2d").drawImage(img,0,0,big.width,big.height);
        const out=document.createElement("canvas"); out.width=tw; out.height=th; const c=out.getContext("2d"); c.imageSmoothingEnabled=true; c.imageSmoothingQuality="high"; c.drawImage(big,0,0,tw,th);
        out.toBlob(b=>{ URL.revokeObjectURL(url); b?resolve(b):reject(new Error("toBlob failed")); },"image/png"); };
      img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error("render failed")); }; img.src=url; });
  }
  $("exportPng").onclick=async()=>{ const scale=parseInt($("pngScale").value,10), tw=state.canvas.w*scale, th=state.canvas.h*scale;
    try{ const b=await rasterize(buildExportSVG(),tw,th); downloadBlob(b,`logo_${tw}x${th}.png`); }
    catch(err){ alert("PNG render failed. If you used a custom font, try re-uploading it, or enable 'outline text'."); } };

  // ---------- ZIP (store) ----------
  function crc32(buf){ let c; const table=crc32.t||(crc32.t=(()=>{const t=[];for(let n=0;n<256;n++){c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})());
    let crc=0xFFFFFFFF; for(let i=0;i<buf.length;i++) crc=(crc>>>8)^table[(crc^buf[i])&0xFF]; return (crc^0xFFFFFFFF)>>>0; }
  const u16=v=>[v&0xff,(v>>8)&0xff], u32=v=>[v&0xff,(v>>8)&0xff,(v>>16)&0xff,(v>>24)&0xff];
  function buildZip(files){ const enc=new TextEncoder(), chunks=[], central=[]; let offset=0;
    for(const f of files){ const name=enc.encode(f.name), crc=crc32(f.data), size=f.data.length;
      const lh=new Uint8Array([].concat(u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(size),u32(size),u16(name.length),u16(0)));
      chunks.push(lh,name,f.data);
      const cen=new Uint8Array([].concat(u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(size),u32(size),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset)));
      central.push(cen,name); offset+=lh.length+name.length+f.data.length; }
    let cl=0; central.forEach(c=>cl+=c.length);
    const eocd=new Uint8Array([].concat(u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(cl),u32(offset),u16(0)));
    const all=[...chunks,...central,eocd]; let total=0; all.forEach(a=>total+=a.length);
    const out=new Uint8Array(total); let p=0; for(const a of all){ out.set(a,p); p+=a.length; } return out;
  }
  $("exportZip").onclick=async()=>{ const btn=$("exportZip"); btn.disabled=true; btn.textContent="…";
    try{
      const svgStr=buildExportSVG(); const enc=new TextEncoder(); const files=[{name:`logo_${state.canvas.w}x${state.canvas.h}.svg`,data:enc.encode(svgStr)}];
      for(const scale of [1,2,4,8]){ const tw=state.canvas.w*scale, th=state.canvas.h*scale;
        const blob=await rasterize(svgStr,tw,th); const buf=new Uint8Array(await blob.arrayBuffer());
        files.push({name:`logo_${tw}x${th}.png`,data:buf}); }
      downloadBlob(new Blob([buildZip(files)],{type:"application/zip"}),"svgforge_export.zip");
    }catch(err){ alert("Batch export failed: "+err.message); }
    finally{ btn.disabled=false; btn.textContent="⤓ all"; } };

  // ---------- project save / load ----------
  $("saveBtn").onclick=()=>downloadBlob(new Blob([JSON.stringify({version:3,canvas:state.canvas,objects:state.objects,fonts:state.fonts,nextId:state.nextId,importSeq:state.importSeq},null,2)],{type:"application/json"}),"svgforge_project.json");
  $("loadBtn").onclick=()=>$("loadInput").click();
  $("loadInput").addEventListener("change",e=>{ const file=e.target.files[0]; if(!file) return; const r=new FileReader();
    r.onload=async()=>{ try{ const d=JSON.parse(r.result); if(!d.canvas||!Array.isArray(d.objects)) throw new Error("bad file");
        state.canvas=d.canvas; state.objects=d.objects; state.fonts=Array.isArray(d.fonts)?d.fonts:[];
        state.objects.forEach(o=>{ if(o.type==="path" && o.points && !o.nodes){ o.nodes=o.points.map(p=>({x:p[0],y:p[1],hIn:null,hOut:null})); delete o.points; } });
        state.nextId=d.nextId||(Math.max(0,...state.objects.map(o=>o.id))+1); state.importSeq=d.importSeq||1; clearSel(); panelKey="";
        for(const k in otCache) delete otCache[k];
        for(const f of state.fonts){ try{ const face=new FontFace(f.name,`url(${f.dataUrl})`); await face.load(); document.fonts.add(face);}catch(_){} }
        $("cw").value=state.canvas.w; $("ch").value=state.canvas.h; $("presetSel").value="custom"; commitInit(); fitZoom();
      }catch(err){ alert("Could not load project: "+err.message); } };
    r.readAsText(file); e.target.value=""; });

  // ---------- boot ----------
  (function seed(){ const hex=defaultObject("hexagon"); hex.fillMode="none"; hex.stroke="#22d3ee"; hex.strokeWidth=2.2; hex.glow=true; hex.x=10; hex.y=6; hex.w=46; hex.h=52; state.objects.push(hex);
    const t=defaultObject("text"); t.text="watcher"; t.x=66; t.y=34; t.fontSize=18; t.glow=true; state.objects.push(t); selectOnly(t.id); })();
  applyBg(); fullRender(); fitZoom(); commitInit();
})();

</script>
</body>
