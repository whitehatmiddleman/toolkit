<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excel → Markdown Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:         #0d0d0f;
    --surface:    #141416;
    --surface2:   #1a1a1e;
    --border:     #2a2a30;
    --border2:    #3a3a44;
    --text:       #e8e8ec;
    --muted:      #7a7a88;
    --accent:     #7c6dfa;
    --accent-dim: #3d3466;
    --accent-fg:  #c4bbff;
    --green:      #3dd68c;
    --green-dim:  #1a3d2b;
    --header-bg:  #1e1e24;
    --header-text:#9898aa;
    --cell-hover: #1f1f28;
    --row-stripe: #161619;
  }
  [data-theme="light"] {
    --bg:         #f5f4f0;
    --surface:    #ffffff;
    --surface2:   #f0eff8;
    --border:     #dddde8;
    --border2:    #c8c8d8;
    --text:       #18181c;
    --muted:      #6e6e80;
    --accent:     #5b4ef0;
    --accent-dim: #e8e5ff;
    --accent-fg:  #3d2fd4;
    --green:      #16a15e;
    --green-dim:  #dcfce7;
    --header-bg:  #ededf5;
    --header-text:#7a7a90;
    --cell-hover: #f5f4ff;
    --row-stripe: #fafaf8;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Geist Mono', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 48px 24px 80px;
    transition: background 0.25s, color 0.25s;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.3;
    pointer-events: none; z-index: 0;
  }

  .wrap {
    position: relative; z-index: 1;
    width: 100%; max-width: 860px;
    display: flex; flex-direction: column; gap: 28px;
  }

  /* ── header ── */
  header {
    display: flex; align-items: flex-end; justify-content: space-between;
    padding-bottom: 20px; border-bottom: 1px solid var(--border);
  }
  .logo { display: flex; align-items: baseline; gap: 10px; }
  .logo-title {
    font-family: 'Instrument Serif', serif;
    font-size: 26px; font-style: italic;
    color: var(--text); letter-spacing: -0.02em; line-height: 1;
  }
  .logo-arrow { font-size: 13px; color: var(--accent); font-weight: 500; }
  .logo-sub { font-size: 10px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }
  .theme-btn {
    background: none; border: 1px solid var(--border2);
    border-radius: 8px; padding: 7px 14px; font-size: 11px;
    font-family: 'Geist Mono', monospace; color: var(--muted);
    cursor: pointer; transition: border-color 0.15s, color 0.15s; letter-spacing: 0.04em;
  }
  .theme-btn:hover { border-color: var(--accent); color: var(--accent-fg); }

  /* ── card ── */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 24px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .card-label {
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted); font-weight: 500;
  }

  /* ── paste zone ── */
  .paste-zone {
    position: relative;
    border: 1px dashed var(--border2);
    border-radius: 10px;
    min-height: 120px;
    overflow: hidden;
    transition: border-color 0.15s;
  }
  .paste-zone:focus-within { border-color: var(--accent); border-style: solid; }
  .paste-zone.has-data { border-style: solid; border-color: var(--border); }

  .paste-hint {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 8px; pointer-events: none;
    transition: opacity 0.15s;
  }
  .paste-hint.hidden { opacity: 0; }
  .paste-icon {
    width: 32px; height: 32px;
    border: 1.5px solid var(--border2); border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  .paste-hint-text { font-size: 12px; color: var(--muted); }
  .paste-hint-sub { font-size: 11px; color: var(--muted); opacity: 0.6; }

  /* hidden textarea to capture paste */
  #paste-capture {
    position: absolute; opacity: 0; pointer-events: none;
    width: 1px; height: 1px; top: 0; left: 0;
    font-size: 1px; color: transparent; background: transparent;
    border: none; outline: none; resize: none;
  }
  .paste-zone-click {
    position: absolute; inset: 0; cursor: text;
  }

  /* ── spreadsheet grid ── */
  .grid-wrapper {
    width: 100%;
    overflow-x: auto;
    display: none;
  }
  .grid-wrapper.visible { display: block; }

  .sheet-table {
    border-collapse: collapse;
    width: 100%;
    min-width: max-content;
    font-size: 12px;
  }

  /* row/col header cells */
  .sh-corner {
    background: var(--header-bg);
    border: 1px solid var(--border);
    width: 36px; min-width: 36px;
    padding: 0;
  }
  .sh-col-header {
    background: var(--header-bg);
    border: 1px solid var(--border);
    padding: 5px 10px;
    text-align: center;
    color: var(--header-text);
    font-size: 11px; font-weight: 400;
    letter-spacing: 0.06em;
    white-space: nowrap;
    user-select: none;
    min-width: 80px;
  }
  .sh-row-header {
    background: var(--header-bg);
    border: 1px solid var(--border);
    padding: 5px 8px;
    text-align: center;
    color: var(--header-text);
    font-size: 11px; font-weight: 400;
    width: 36px; min-width: 36px;
    user-select: none;
  }

  /* data cells */
  .sh-cell {
    border: 1px solid var(--border);
    padding: 5px 10px;
    white-space: nowrap;
    color: var(--text);
    max-width: 240px;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: background 0.08s;
  }
  .sh-cell:hover { background: var(--cell-hover); }
  tr:nth-child(even) .sh-cell { background: var(--row-stripe); }
  tr:nth-child(even) .sh-cell:hover { background: var(--cell-hover); }

  /* header row highlight */
  .sh-header-row .sh-cell {
    background: var(--accent-dim);
    color: var(--accent-fg);
    font-weight: 500;
    border-color: var(--border2);
  }
  [data-theme="light"] .sh-header-row .sh-cell {
    background: var(--accent-dim);
    color: var(--accent-fg);
  }

  .grid-meta {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 2px 0;
  }
  .grid-meta-info { font-size: 11px; color: var(--muted); }
  .btn-clear-grid {
    background: none; border: none; font-size: 11px;
    color: var(--muted); cursor: pointer; font-family: 'Geist Mono', monospace;
    padding: 2px 6px; border-radius: 4px;
    transition: color 0.12s;
  }
  .btn-clear-grid:hover { color: var(--text); }

  /* ── options ── */
  .options {
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
  }
  .check-label {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--muted); cursor: pointer; user-select: none;
  }
  .check-label input[type=checkbox] {
    appearance: none; width: 16px; height: 16px;
    border: 1px solid var(--border2); border-radius: 4px;
    background: var(--surface2); cursor: pointer; position: relative;
    transition: background 0.12s, border-color 0.12s; flex-shrink: 0;
  }
  .check-label input[type=checkbox]:checked { background: var(--accent); border-color: var(--accent); }
  .check-label input[type=checkbox]:checked::after {
    content: '';
    position: absolute; left: 4px; top: 1.5px;
    width: 5px; height: 9px;
    border: 2px solid #fff; border-top: none; border-left: none;
    transform: rotate(45deg);
  }
  .select-wrap { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  select {
    background: var(--surface2); color: var(--text);
    border: 1px solid var(--border2); border-radius: 6px;
    padding: 5px 10px; font-size: 12px;
    font-family: 'Geist Mono', monospace;
    outline: none; cursor: pointer; transition: border-color 0.12s;
  }
  select:focus { border-color: var(--accent); }

  /* ── toolbar ── */
  .toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
  .btn {
    padding: 8px 18px; font-size: 12px;
    font-family: 'Geist Mono', monospace;
    border-radius: 8px; border: 1px solid var(--border2);
    background: transparent; color: var(--text);
    cursor: pointer; transition: all 0.12s;
    white-space: nowrap; letter-spacing: 0.02em;
  }
  .btn:hover { background: var(--surface2); }
  .btn:active { transform: scale(0.97); }
  .btn-accent { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
  .btn-accent:hover { opacity: 0.85; background: var(--accent); }
  .btn-sm { padding: 5px 12px; font-size: 11px; }
  .sep { flex: 1; }
  #status {
    font-size: 11px; color: var(--muted);
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 10px;
    display: none; letter-spacing: 0.04em;
  }
  #status.visible { display: block; }

  /* ── output ── */
  .output-header { display: flex; align-items: center; justify-content: space-between; }
  .output-box {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; min-height: 80px;
    font-family: 'Geist Mono', monospace; font-size: 13px; line-height: 1.8;
    color: var(--text); white-space: pre; overflow-x: auto;
    transition: border-color 0.2s;
  }
  .output-box.has-content { border-color: var(--green-dim); }
  .output-empty { font-size: 12px; color: var(--muted); font-style: italic; }
  .copy-flash { color: var(--green) !important; border-color: var(--green-dim) !important; }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="logo">
      <span class="logo-title">Excel</span>
      <span class="logo-arrow">→ md</span>
      <span class="logo-sub">table converter</span>
    </div>
    <button class="theme-btn" id="theme-btn">☀ light</button>
  </header>

  <div class="card">
    <span class="card-label">Input — paste from Excel or Google Sheets</span>

    <div class="paste-zone" id="paste-zone">
      <div class="paste-hint" id="paste-hint">
        <div class="paste-icon">⌘</div>
        <span class="paste-hint-text">Click here, then paste  (Ctrl+V / ⌘V)</span>
        <span class="paste-hint-sub">Excel / Google Sheets cells, or a raw markdown table</span>
      </div>
      <div class="paste-zone-click" id="paste-zone-click"></div>
      <textarea id="paste-capture" tabindex="-1" aria-hidden="true"></textarea>

      <div class="grid-wrapper" id="grid-wrapper">
        <table class="sheet-table" id="sheet-table"></table>
        <div class="grid-meta">
          <span class="grid-meta-info" id="grid-meta-info"></span>
          <button class="btn-clear-grid" id="clear-grid-btn">✕ clear</button>
        </div>
      </div>
    </div>

    <div class="options">
      <label class="check-label">
        <input type="checkbox" id="header-chk" checked>
        First row is header
      </label>
      <div class="select-wrap">
        Align
        <select id="align-sel">
          <option value="left">Left</option>
          <option value="center">Center</option>
          <option value="right">Right</option>
        </select>
      </div>
    </div>

    <div class="toolbar">
      <button class="btn btn-accent" id="convert-btn">Convert</button>
      <div class="sep"></div>
      <span id="status"></span>
    </div>
  </div>

  <div class="card">
    <div class="output-header">
      <span class="card-label">Markdown output</span>
      <button class="btn btn-sm" id="copy-btn">Copy</button>
    </div>
    <div class="output-box" id="output-area"><span class="output-empty">Output will appear here…</span></div>
  </div>
</div>

<script>
const pasteZone     = document.getElementById('paste-zone');
const pasteCapture  = document.getElementById('paste-capture');
const pasteHint     = document.getElementById('paste-hint');
const pasteZoneClick= document.getElementById('paste-zone-click');
const gridWrapper   = document.getElementById('grid-wrapper');
const sheetTable    = document.getElementById('sheet-table');
const gridMetaInfo  = document.getElementById('grid-meta-info');
const clearGridBtn  = document.getElementById('clear-grid-btn');
const convertBtn    = document.getElementById('convert-btn');
const copyBtn       = document.getElementById('copy-btn');
const headerChk     = document.getElementById('header-chk');
const alignSel      = document.getElementById('align-sel');
const statusEl      = document.getElementById('status');
const outputEl      = document.getElementById('output-area');
const themeBtn      = document.getElementById('theme-btn');

// ── theme ──
let dark = true;
themeBtn.addEventListener('click', () => {
  dark = !dark;
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  themeBtn.textContent = dark ? '☀ light' : '☾ dark';
});

// ── stored parsed rows ──
let parsedRows = [];

// ── col letter helper ──
function colLetter(n) {
  let s = '';
  n += 1;
  while (n > 0) {
    n--;
    s = String.fromCharCode(65 + (n % 26)) + s;
    n = Math.floor(n / 26);
  }
  return s;
}

// ── detect markdown table ──
function isMarkdownTable(raw) {
  const lines = raw.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n')
    .map(l => l.trim()).filter(l => l.length > 0);
  if (lines.length < 2) return false;
  const hasDataRow  = lines[0].startsWith('|') && lines[0].endsWith('|');
  const hasDivider  = lines.some(l => /^\|[\s|:\-]+\|$/.test(l));
  return hasDataRow && hasDivider;
}

// ── parse markdown table into rows (skips divider row) ──
function parseMarkdownTable(raw) {
  const lines = raw.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n')
    .map(l => l.trim()).filter(l => l.length > 0);
  const isDivider = l => /^\|[\s|:\-]+\|$/.test(l) && !/[a-zA-Z0-9]/.test(l);
  return lines
    .filter(l => !isDivider(l))
    .map(l => {
      // strip leading/trailing pipes then split
      const inner = l.replace(/^\|/, '').replace(/\|$/, '');
      return inner.split('|').map(c => c.trim());
    });
}

// ── parse TSV / quoted CSV ──
function parseRows(raw) {
  const lines = raw.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
  const trimmed = [];
  for (let i = lines.length - 1; i >= 0; i--) {
    if (lines[i].trim().length > 0 || trimmed.length > 0) trimmed.unshift(lines[i]);
  }
  return trimmed.map(line => {
    const cells = [];
    let cur = '', inQuote = false;
    for (let ci = 0; ci < line.length; ci++) {
      const ch = line[ci];
      if (ch === '"') {
        if (inQuote && line[ci + 1] === '"') { cur += '"'; ci++; }
        else { inQuote = !inQuote; }
      } else if (ch === '\t' && !inQuote) {
        cells.push(cur); cur = '';
      } else {
        cur += ch;
      }
    }
    cells.push(cur);
    return cells.map(c => c.trim());
  });
}

// ── unified ingest: detect format then parse ──
function ingest(raw) {
  if (isMarkdownTable(raw)) {
    // markdown table always has a header row by definition — force checkbox on
    headerChk.checked = true;
    return parseMarkdownTable(raw);
  }
  return parseRows(raw);
}

// ── render spreadsheet grid ──
function renderGrid(rows) {
  if (!rows.length) return;
  const colCount = Math.max(...rows.map(r => r.length));
  const showHeader = headerChk.checked;

  let html = '<thead><tr>';
  html += '<th class="sh-corner"></th>';
  for (let c = 0; c < colCount; c++) {
    html += `<th class="sh-col-header">${colLetter(c)}</th>`;
  }
  html += '</tr></thead><tbody>';

  rows.forEach((row, ri) => {
    const isHeader = showHeader && ri === 0;
    html += `<tr${isHeader ? ' class="sh-header-row"' : ''}>`;
    html += `<td class="sh-row-header">${ri + 1}</td>`;
    for (let ci = 0; ci < colCount; ci++) {
      const val = (row[ci] !== undefined ? row[ci] : '');
      const escaped = val.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      html += `<td class="sh-cell" title="${escaped}">${escaped || '<span style="color:var(--border2)">·</span>'}</td>`;
    }
    html += '</tr>';
  });

  html += '</tbody>';
  sheetTable.innerHTML = html;
  gridMetaInfo.textContent = rows.length + ' row' + (rows.length !== 1 ? 's' : '') + ' × ' + colCount + ' col' + (colCount !== 1 ? 's' : '');
  gridWrapper.classList.add('visible');
  pasteHint.classList.add('hidden');
  pasteZone.classList.add('has-data');
}

// ── clear grid ──
function clearAll() {
  parsedRows = [];
  sheetTable.innerHTML = '';
  gridWrapper.classList.remove('visible');
  pasteHint.classList.remove('hidden');
  pasteZone.classList.remove('has-data');
  pasteCapture.value = '';
  outputEl.innerHTML = '<span class="output-empty">Output will appear here…</span>';
  outputEl.classList.remove('has-content');
  statusEl.className = '';
}

clearGridBtn.addEventListener('click', clearAll);

// ── re-render on header toggle ──
headerChk.addEventListener('change', () => {
  if (parsedRows.length) renderGrid(parsedRows);
  if (hasOutput()) convert();
});

// ── focus paste capture on click ──
pasteZoneClick.addEventListener('click', () => {
  pasteCapture.focus();
});
pasteZone.addEventListener('click', (e) => {
  if (!gridWrapper.classList.contains('visible') || e.target === pasteZoneClick) {
    pasteCapture.focus();
  }
});

// ── paste handler ──
pasteCapture.addEventListener('paste', (e) => {
  e.preventDefault();
  const raw = e.clipboardData.getData('text/plain');
  if (!raw.trim()) return;
  parsedRows = ingest(raw);
  if (parsedRows.length) { renderGrid(parsedRows); autoConvert(); }
});

// also allow pasting anywhere in the page
document.addEventListener('paste', (e) => {
  if (document.activeElement === pasteCapture) return;
  const raw = e.clipboardData.getData('text/plain');
  if (!raw.trim()) return;
  parsedRows = ingest(raw);
  if (parsedRows.length) { renderGrid(parsedRows); autoConvert(); }
});

// ── markdown builder ──
function buildMarkdown(rows, hasHeader, align) {
  if (!rows.length) return '';
  const colCount = Math.max(...rows.map(r => r.length));
  const padded = rows.map(r => {
    const a = r.map(c => c.replace(/\|/g, '\\|'));
    while (a.length < colCount) a.push('');
    return a;
  });
  const colWidths = Array.from({ length: colCount }, (_, ci) =>
    Math.max(3, ...padded.map(r => r[ci].length))
  );
  const makeDivider = w => {
    if (align === 'center') return ':' + '-'.repeat(Math.max(1, w - 2)) + ':';
    if (align === 'right')  return '-'.repeat(Math.max(1, w - 1)) + ':';
    return ':' + '-'.repeat(Math.max(1, w - 1));
  };
  const dividers = colWidths.map(makeDivider);
  const formatRow = r => '| ' + r.map((c, ci) => {
    const pad = colWidths[ci] - c.length;
    if (align === 'right')  return ' '.repeat(pad) + c;
    if (align === 'center') { const l = Math.floor(pad / 2); return ' '.repeat(l) + c + ' '.repeat(pad - l); }
    return c + ' '.repeat(pad);
  }).join(' | ') + ' |';

  const lines = [];
  const headerRow = hasHeader ? padded[0] : Array.from({ length: colCount }, (_, i) => 'Column ' + (i + 1));
  lines.push(formatRow(headerRow));
  lines.push('| ' + dividers.map((d, ci) => {
    const t = colWidths[ci];
    return d.length < t ? d.padEnd(t, '-').slice(0, t) : d.slice(0, t);
  }).join(' | ') + ' |');
  (hasHeader ? padded.slice(1) : padded).forEach(r => lines.push(formatRow(r)));
  return lines.join('\n');
}

function hasOutput() {
  return outputEl.textContent.trim() && !outputEl.querySelector('.output-empty');
}

function convert() {
  if (!parsedRows.length) return;
  const md = buildMarkdown(parsedRows, headerChk.checked, alignSel.value);
  outputEl.textContent = md;
  outputEl.classList.add('has-content');
  const cols = Math.max(...parsedRows.map(r => r.length));
  statusEl.textContent = parsedRows.length + 'r × ' + cols + 'c';
  statusEl.className = 'visible';
}

function autoConvert() { convert(); }

convertBtn.addEventListener('click', convert);
alignSel.addEventListener('change', () => { if (hasOutput()) convert(); });

copyBtn.addEventListener('click', () => {
  if (!hasOutput()) return;
  navigator.clipboard.writeText(outputEl.textContent).then(() => {
    copyBtn.textContent = '✓ Copied';
    copyBtn.classList.add('copy-flash');
    setTimeout(() => { copyBtn.textContent = 'Copy'; copyBtn.classList.remove('copy-flash'); }, 1600);
  });
});
</script>
</body>
</html>
