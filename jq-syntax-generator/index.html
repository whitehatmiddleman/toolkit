<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jq Syntax Generator</title>
  <style>
    :root {
      --bg: #0d0f12;
      --surface: #16191f;
      --surface-2: #1e222a;
      --code-bg: #0a0c10;
      --border: #2a2f3a;
      --border2: #3a4150;
      --text: #e6e9ef;
      --text-muted: #8b919e;
      --accent: #6d8bff;
      --accent-hover: #8aa1ff;
      --accent-soft: rgba(109, 139, 255, 0.14);
      --success: #45d483;
      --danger: #ff6b6b;
      --radius: 12px;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      /* syntax token colors */
      --tok-key: #9ec5ff;
      --tok-str: #e0a56b;
      --tok-num: #9fe0a8;
      --tok-bool: #6d8bff;
      --tok-dim: #6b7280;
      --tok-result: #4fd6b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #181c24 0%, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.55;
      padding: 40px 22px 80px;
      -webkit-font-smoothing: antialiased;
    }

    .wrap { max-width: 1080px; margin: 0 auto; }

    /* ---------- Header ---------- */
    .hero { margin-bottom: 24px; }
    .pill {
      display: inline-block; background: var(--accent-soft); color: var(--accent);
      font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
      padding: 4px 10px; border-radius: 999px; margin-bottom: 14px;
    }
    h1 { font-size: 1.7rem; letter-spacing: -0.03em; margin-bottom: 6px; }
    .sub { color: var(--text-muted); font-size: 0.95rem; }

    /* ---------- Cards ---------- */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
    }

    #input-section { margin-bottom: 18px; }
    #json-input {
      width: 100%; height: 140px;
      background: var(--surface-2); color: var(--text);
      border: 1px solid var(--border); border-radius: 9px;
      padding: 12px; font-family: var(--mono); font-size: 0.83rem;
      resize: vertical; outline: none; line-height: 1.5;
      transition: border-color 0.14s, box-shadow 0.14s;
    }
    #json-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

    .btn-row { display: flex; gap: 10px; margin-top: 12px; align-items: center; }
    button {
      padding: 8px 16px; border: 1px solid var(--border2); border-radius: 8px;
      cursor: pointer; font-family: inherit; font-size: 0.83rem; font-weight: 600;
      background: transparent; color: var(--text); transition: all 0.14s;
    }
    button:hover { background: var(--surface-2); border-color: var(--accent); }
    button:active { transform: translateY(1px); }
    #parse-btn { background: var(--accent); border-color: var(--accent); color: #0a0c10; }
    #parse-btn:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    #parse-error { margin-top: 10px; color: var(--danger); font-size: 0.82rem; min-height: 1em; }

    /* ---------- Main area ---------- */
    #main-area { display: flex; gap: 16px; align-items: flex-start; }
    #tree-panel { flex: 1; min-width: 0; }
    #result-panel { width: 320px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; }
    @media (max-width: 820px) {
      #main-area { flex-direction: column; }
      #result-panel { width: 100%; }
    }

    #tree-container {
      background: var(--code-bg); border: 1px solid var(--border); border-radius: 10px;
      padding: 12px 14px; min-height: 130px; overflow: auto; max-height: 68vh;
      font-family: var(--mono);
    }
    #tree-placeholder { color: var(--text-muted); font-size: 0.83rem; font-style: italic; }

    ul { list-style: none; padding-left: 16px; }
    ul.tree-root { padding-left: 0; }
    li { line-height: 1.2; }
    .node-row {
      display: flex; align-items: baseline; gap: 4px;
      padding: 2px 4px; border-radius: 5px; cursor: default;
    }
    .node-row.selected { background: var(--accent-soft); outline: 1px solid var(--accent); }
    .toggle {
      cursor: pointer; color: var(--tok-dim); user-select: none;
      font-size: 0.62rem; width: 10px; flex-shrink: 0; display: inline-block; text-align: center;
    }
    .node-label { cursor: pointer; font-size: 0.82rem; white-space: nowrap; }
    .node-label:hover { filter: brightness(1.25); }
    .k { color: var(--tok-key); }
    .colon { color: var(--text-muted); margin: 0 2px; }
    .sv { color: var(--tok-str); }
    .nv { color: var(--tok-num); }
    .bv { color: var(--tok-bool); }
    .th { color: var(--tok-dim); font-size: 0.76rem; }

    /* ---------- Result cards ---------- */
    .result-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px;
    }
    .card-label {
      display: block; color: var(--text-muted); font-size: 0.7rem;
      text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; font-weight: 600;
    }
    #path-row { display: flex; gap: 7px; }
    #path-output {
      flex: 1; background: var(--code-bg); color: var(--tok-result);
      border: 1px solid var(--border); border-radius: 7px; padding: 6px 9px;
      font-family: var(--mono); font-size: 0.84rem; outline: none;
    }
    #path-output:focus { border-color: var(--accent); }
    #copy-btn, #filter-copy-btn { padding: 6px 12px; }
    #copy-status, #filter-copy-status { font-size: 0.72rem; color: var(--success); min-height: 1.1em; margin-top: 5px; }
    #test-status { font-size: 0.8rem; margin-bottom: 6px; min-height: 1em; }
    #test-status.pass { color: var(--success); }
    #test-status.fail { color: var(--danger); }
    #resolved-value {
      background: var(--code-bg); border: 1px solid var(--border); border-radius: 7px;
      padding: 8px; font-family: var(--mono); font-size: 0.76rem; overflow: auto; max-height: 180px;
      white-space: pre-wrap; word-break: break-all; color: var(--text); min-height: 2em;
    }

    /* Filter card */
    .filter-row { display: flex; gap: 7px; margin-bottom: 7px; align-items: center; }
    #filter-op, #filter-value, #filter-flags, #filter-output {
      background: var(--surface-2); color: var(--text);
      border: 1px solid var(--border); border-radius: 7px; padding: 6px 9px;
      font-family: var(--mono); font-size: 0.82rem; outline: none;
    }
    #filter-op { width: 100%; cursor: pointer; }
    #filter-op:focus, #filter-value:focus, #filter-flags:focus { border-color: var(--accent); }
    #filter-value { flex: 1; min-width: 0; }
    #filter-flags { width: 64px; flex-shrink: 0; }
    #filter-output { flex: 1; min-width: 0; color: var(--tok-result); background: var(--code-bg); }
    #filter-expr-row { display: flex; gap: 7px; }
    #filter-hint { font-size: 0.7rem; color: var(--tok-dim); margin-top: 4px; font-style: italic; }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <span class="pill">JSON Tool</span>
      <h1>jq Syntax Generator</h1>
      <p class="sub">Paste JSON, click any node, and get the matching jq path — plus a filter-expression builder.</p>
    </header>

    <div id="input-section" class="card">
      <textarea id="json-input" placeholder='Paste JSON here, e.g. {"name":"Alice","scores":[10,20]}'></textarea>
      <div class="btn-row">
        <button id="parse-btn">Parse JSON</button>
        <button id="sample-btn">Load sample</button>
      </div>
      <div id="parse-error"></div>
    </div>

    <div id="main-area">
      <div id="tree-panel">
        <div id="tree-container">
          <span id="tree-placeholder">Paste JSON above and click Parse.</span>
        </div>
      </div>
      <div id="result-panel">
        <div class="result-card">
          <span class="card-label">jq Path</span>
          <div id="path-row">
            <input type="text" id="path-output" readonly placeholder="click a node…" />
            <button id="copy-btn">Copy</button>
          </div>
          <div id="copy-status"></div>
        </div>
        <div class="result-card">
          <span class="card-label">Path test — resolved value</span>
          <div id="test-status"></div>
          <pre id="resolved-value"></pre>
        </div>
        <div class="result-card">
          <span class="card-label">Value Filter</span>
          <div class="filter-row">
            <select id="filter-op">
              <option value="eq">== equals</option>
              <option value="neq">!= not equals</option>
              <option value="gt">&gt; greater than</option>
              <option value="lt">&lt; less than</option>
              <option value="gte">&gt;= gte</option>
              <option value="lte">&lt;= lte</option>
              <option value="contains">| contains</option>
              <option value="startswith">| startswith</option>
              <option value="endswith">| endswith</option>
              <option value="test">| test (regex)</option>
              <option value="null">== null</option>
              <option value="notnull">!= null</option>
            </select>
          </div>
          <div class="filter-row" id="filter-value-row">
            <input type="text" id="filter-value" placeholder="value or pattern…" />
            <input type="text" id="filter-flags" placeholder="flags"
              title="Regex flags: i=case-insensitive, x=extended, s=dot-all, m=multiline"
              style="display:none" />
          </div>
          <div id="filter-expr-row">
            <input type="text" id="filter-output" readonly placeholder="select a node first…" />
            <button id="filter-copy-btn">Copy</button>
          </div>
          <div id="filter-copy-status"></div>
          <div id="filter-hint"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    'use strict';

    let currentJson = null;
    let selectedRow = null;
    let currentPath = null;

    // ── path builders ──────────────────────────────────────────────────

    function isSimpleKey(key) {
      return /^[a-zA-Z_$][a-zA-Z0-9_$]*$/.test(key);
    }

    function buildChildPath(parentPath, key, isIndex) {
      const prefix = parentPath === '.' ? '' : parentPath;
      if (isIndex) {
        return prefix + '.[' + key + ']';
      }
      if (isSimpleKey(String(key))) {
        return prefix + '.' + key;
      }
      const escaped = String(key).replace(/\\/g, '\\\\').replace(/"/g, '\\"');
      return prefix + '.["' + escaped + '"]';
    }

    // ── path evaluator ─────────────────────────────────────────────────

    function tokenizePath(jqPath) {
      const tokens = [];
      let i = 1; // skip leading '.'
      while (i < jqPath.length) {
        if (jqPath[i] === '.') { i++; continue; }
        if (jqPath[i] === '[') {
          const closeIdx = jqPath.indexOf(']', i);
          if (closeIdx === -1) throw new Error('Malformed path: unclosed [');
          const inner = jqPath.slice(i + 1, closeIdx);
          i = closeIdx + 1;
          if (inner.startsWith('"') && inner.endsWith('"')) {
            const key = inner.slice(1, -1).replace(/\\"/g, '"').replace(/\\\\/g, '\\');
            tokens.push({ type: 'key', value: key });
          } else {
            const idx = parseInt(inner, 10);
            if (isNaN(idx)) throw new Error('Malformed path: invalid index "' + inner + '"');
            tokens.push({ type: 'index', value: idx });
          }
        } else {
          let j = i;
          while (j < jqPath.length && jqPath[j] !== '.' && jqPath[j] !== '[') j++;
          if (j === i) { i++; continue; }
          tokens.push({ type: 'key', value: jqPath.slice(i, j) });
          i = j;
        }
      }
      return tokens;
    }

    function evaluatePath(json, jqPath) {
      if (jqPath === '.') return { ok: true, value: json };
      let tokens;
      try { tokens = tokenizePath(jqPath); }
      catch (e) { return { ok: false, error: e.message }; }

      let current = json;
      for (const token of tokens) {
        if (token.type === 'key') {
          if (current === null || typeof current !== 'object' || Array.isArray(current)) {
            return { ok: false, error: 'Expected object for key "' + token.value + '"' };
          }
          if (!(token.value in current)) {
            return { ok: false, error: 'Key not found: "' + token.value + '"' };
          }
          current = current[token.value];
        } else {
          if (!Array.isArray(current)) {
            return { ok: false, error: 'Expected array at index ' + token.value };
          }
          if (token.value < 0 || token.value >= current.length) {
            return { ok: false, error: 'Index out of bounds: ' + token.value };
          }
          current = current[token.value];
        }
      }
      return { ok: true, value: current };
    }

    // ── value filter builder ───────────────────────────────────────────

    function jqLiteral(raw) {
      const t = raw.trim();
      if (t === 'null') return 'null';
      if (t === 'true') return 'true';
      if (t === 'false') return 'false';
      if (/^-?\d+(\.\d+)?([eE][+-]?\d+)?$/.test(t)) return t;
      return '"' + raw.replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"';
    }

    function jqStr(raw) {
      return '"' + raw.replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"';
    }

    function buildFilterExpression(path, op, rawValue, flags) {
      const needsValue = op !== 'null' && op !== 'notnull';
      if (needsValue && !rawValue.trim()) return '';
      switch (op) {
        case 'eq':         return 'select(' + path + ' == ' + jqLiteral(rawValue) + ')';
        case 'neq':        return 'select(' + path + ' != ' + jqLiteral(rawValue) + ')';
        case 'gt':         return 'select(' + path + ' > '  + jqLiteral(rawValue) + ')';
        case 'lt':         return 'select(' + path + ' < '  + jqLiteral(rawValue) + ')';
        case 'gte':        return 'select(' + path + ' >= ' + jqLiteral(rawValue) + ')';
        case 'lte':        return 'select(' + path + ' <= ' + jqLiteral(rawValue) + ')';
        case 'contains':   return 'select(' + path + ' | contains(' + jqStr(rawValue) + '))';
        case 'startswith': return 'select(' + path + ' | startswith(' + jqStr(rawValue) + '))';
        case 'endswith':   return 'select(' + path + ' | endswith(' + jqStr(rawValue) + '))';
        case 'test': {
          const f = flags && flags.trim();
          return f
            ? 'select(' + path + ' | test(' + jqStr(rawValue) + '; ' + jqStr(f) + '))'
            : 'select(' + path + ' | test(' + jqStr(rawValue) + '))';
        }
        case 'null':    return 'select(' + path + ' == null)';
        case 'notnull': return 'select(' + path + ' != null)';
        default:        return '';
      }
    }

    function updateFilterControls() {
      const op = document.getElementById('filter-op').value;
      const needsValue = op !== 'null' && op !== 'notnull';
      document.getElementById('filter-value-row').style.display = needsValue ? '' : 'none';
      document.getElementById('filter-flags').style.display = op === 'test' ? '' : 'none';
    }

    function updateFilterExpression() {
      const outputEl = document.getElementById('filter-output');
      if (!currentPath) {
        outputEl.value = '';
        outputEl.placeholder = 'select a node first…';
        document.getElementById('filter-hint').textContent = '';
        return;
      }
      const op = document.getElementById('filter-op').value;
      const rawValue = document.getElementById('filter-value').value;
      const flags = document.getElementById('filter-flags').value;
      const expr = buildFilterExpression(currentPath, op, rawValue, flags);
      outputEl.value = expr;
      outputEl.placeholder = 'enter a value…';
      document.getElementById('filter-copy-status').textContent = '';
      const hintEl = document.getElementById('filter-hint');
      if (op === 'test') {
        hintEl.textContent = 'ONIG regex — flags: i=case-insensitive, x=extended, s=dot-all, m=multiline';
      } else if (op === 'null' || op === 'notnull') {
        hintEl.textContent = '';
      } else if (op === 'contains' || op === 'startswith' || op === 'endswith') {
        hintEl.textContent = 'Literal string match (no wildcards).';
      } else {
        hintEl.textContent = 'Numbers/booleans/null auto-detected; anything else is a string.';
      }
    }

    // ── tree rendering ─────────────────────────────────────────────────

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatLeafValue(val) {
      if (val === null) return '<span class="bv">null</span>';
      if (typeof val === 'boolean') return '<span class="bv">' + val + '</span>';
      if (typeof val === 'number') return '<span class="nv">' + val + '</span>';
      if (typeof val === 'string') {
        const display = val.length > 60 ? val.slice(0, 60) + '…' : val;
        return '<span class="sv">"' + escapeHtml(display) + '"</span>';
      }
      return escapeHtml(String(val));
    }

    function renderNode(value, jqPath, keyLabel) {
      const li = document.createElement('li');

      const isLeaf = value === null || typeof value !== 'object';
      const isArray = !isLeaf && Array.isArray(value);
      const isObj = !isLeaf && !isArray;
      const childCount = isLeaf ? 0 : (isArray ? value.length : Object.keys(value).length);

      const row = document.createElement('div');
      row.className = 'node-row';
      row.dataset.path = jqPath;

      // toggle arrow (only for branches)
      const toggle = document.createElement('span');
      toggle.className = 'toggle';
      if (!isLeaf) toggle.textContent = '▼';
      row.appendChild(toggle);

      // clickable label
      const label = document.createElement('span');
      label.className = 'node-label';

      let html = '';
      if (keyLabel !== null) {
        html += '<span class="k">' + escapeHtml(String(keyLabel)) + '</span>';
        html += '<span class="colon">:</span>';
      }
      if (isLeaf) {
        html += formatLeafValue(value);
      } else if (isArray) {
        html += '<span class="th">[ ' + childCount + ' item' + (childCount !== 1 ? 's' : '') + ' ]</span>';
      } else {
        html += '<span class="th">{ ' + childCount + ' key' + (childCount !== 1 ? 's' : '') + ' }</span>';
      }
      label.innerHTML = html;
      row.appendChild(label);
      li.appendChild(row);

      // children
      let childUl = null;
      if (!isLeaf) {
        childUl = document.createElement('ul');
        if (isArray) {
          value.forEach((item, idx) => {
            childUl.appendChild(renderNode(item, buildChildPath(jqPath, idx, true), idx));
          });
        } else {
          Object.keys(value).forEach(key => {
            childUl.appendChild(renderNode(value[key], buildChildPath(jqPath, key, false), key));
          });
        }
        li.appendChild(childUl);

        toggle.addEventListener('click', (e) => {
          e.stopPropagation();
          const collapsed = childUl.style.display === 'none';
          childUl.style.display = collapsed ? '' : 'none';
          toggle.textContent = collapsed ? '▼' : '▶';
        });
      }

      label.addEventListener('click', () => {
        if (selectedRow) selectedRow.classList.remove('selected');
        selectedRow = row;
        row.classList.add('selected');
        selectPath(jqPath);
      });

      return li;
    }

    function renderTree(json) {
      const container = document.getElementById('tree-container');
      container.innerHTML = '';

      const ul = document.createElement('ul');
      ul.className = 'tree-root';

      // root node: path ".", no key label
      const rootLi = renderNode(json, '.', null);

      // inject a "(root)" key label into the root row
      const rootLabel = rootLi.querySelector('.node-label');
      const isArr = Array.isArray(json);
      const count = isArr ? json.length : Object.keys(json).length;
      rootLabel.innerHTML =
        '<span class="k">(root)</span><span class="colon">:</span>' +
        '<span class="th">' + (isArr ? '[' : '{') + ' ' + count + ' ' +
        (isArr ? 'items' : 'keys') + ' ' + (isArr ? ']' : '}') + '</span>';

      ul.appendChild(rootLi);
      container.appendChild(ul);
    }

    // ── path selection + test ──────────────────────────────────────────

    function selectPath(jqPath) {
      currentPath = jqPath;
      document.getElementById('path-output').value = jqPath;
      document.getElementById('copy-status').textContent = '';

      const result = evaluatePath(currentJson, jqPath);
      const statusEl = document.getElementById('test-status');
      const resolvedEl = document.getElementById('resolved-value');

      if (result.ok) {
        statusEl.className = 'pass';
        statusEl.textContent = '✓ Resolves successfully';
        const val = result.value;
        resolvedEl.textContent = (val === null || typeof val !== 'object')
          ? JSON.stringify(val)
          : JSON.stringify(val, null, 2);
      } else {
        statusEl.className = 'fail';
        statusEl.textContent = '✗ ' + result.error;
        resolvedEl.textContent = '';
      }
      updateFilterExpression();
    }

    // ── event listeners ────────────────────────────────────────────────

    document.getElementById('parse-btn').addEventListener('click', () => {
      const raw = document.getElementById('json-input').value.trim();
      const errorEl = document.getElementById('parse-error');

      if (!raw) {
        errorEl.textContent = 'Please paste some JSON first.';
        return;
      }

      let parsed;
      try {
        parsed = JSON.parse(raw);
      } catch (e) {
        errorEl.textContent = 'JSON parse error: ' + e.message;
        return;
      }

      if (parsed === null || typeof parsed !== 'object') {
        errorEl.textContent = 'Root value must be an object or array, not a primitive.';
        return;
      }

      errorEl.textContent = '';
      currentJson = parsed;
      selectedRow = null;
      currentPath = null;
      document.getElementById('path-output').value = '';
      document.getElementById('copy-status').textContent = '';
      document.getElementById('test-status').textContent = '';
      document.getElementById('resolved-value').textContent = '';
      document.getElementById('filter-output').value = '';
      document.getElementById('filter-output').placeholder = 'select a node first…';
      document.getElementById('filter-value').value = '';
      document.getElementById('filter-copy-status').textContent = '';
      document.getElementById('filter-hint').textContent = '';
      renderTree(currentJson);
    });

    document.getElementById('copy-btn').addEventListener('click', () => {
      const path = document.getElementById('path-output').value;
      if (!path) return;
      const statusEl = document.getElementById('copy-status');
      const showCopied = () => {
        statusEl.textContent = 'Copied!';
        setTimeout(() => { statusEl.textContent = ''; }, 2000);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(path).then(showCopied).catch(() => {
          document.getElementById('path-output').select();
          document.execCommand('copy');
          showCopied();
        });
      } else {
        document.getElementById('path-output').select();
        document.execCommand('copy');
        showCopied();
      }
    });

    document.getElementById('filter-op').addEventListener('change', () => {
      updateFilterControls();
      updateFilterExpression();
    });

    document.getElementById('filter-value').addEventListener('input', updateFilterExpression);
    document.getElementById('filter-flags').addEventListener('input', updateFilterExpression);

    document.getElementById('filter-copy-btn').addEventListener('click', () => {
      const expr = document.getElementById('filter-output').value;
      if (!expr) return;
      const statusEl = document.getElementById('filter-copy-status');
      const showCopied = () => {
        statusEl.textContent = 'Copied!';
        setTimeout(() => { statusEl.textContent = ''; }, 2000);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(expr).then(showCopied).catch(() => {
          document.getElementById('filter-output').select();
          document.execCommand('copy');
          showCopied();
        });
      } else {
        document.getElementById('filter-output').select();
        document.execCommand('copy');
        showCopied();
      }
    });

    document.getElementById('sample-btn').addEventListener('click', () => {
      document.getElementById('json-input').value = JSON.stringify({
        "user": {
          "id": 42,
          "name": "Alice",
          "active": true,
          "score": 9.5,
          "tags": ["admin", "editor"],
          "address": {
            "city": "Portland",
            "zip": "97201"
          },
          "key with spaces": "bracket notation demo"
        },
        "results": [
          { "rank": 1, "value": 100 },
          { "rank": 2, "value": 80 }
        ]
      }, null, 2);
      document.getElementById('parse-error').textContent = '';
    });
  </script>
</body>
</html>
