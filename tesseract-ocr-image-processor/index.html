<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hOCR Viewer</title>
  <style>
    :root {
      --bg: #0d0f12;
      --surface: #16191f;
      --surface-2: #1e222a;
      --border: #2a2f3a;
      --border2: #3a4150;
      --text: #e6e9ef;
      --text-muted: #8b919e;
      --accent: #6d8bff;
      --accent-hover: #8aa1ff;
      --accent-soft: rgba(109, 139, 255, 0.14);
      --success: #45d483;
      --highlight: rgba(109, 139, 255, 0.28);
      --highlight-border: rgba(138, 161, 255, 0.85);
      --radius: 12px;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #181c24 0%, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.55;
      padding: 40px 22px 80px;
      -webkit-font-smoothing: antialiased;
    }

    .wrap { max-width: 960px; margin: 0 auto; }

    /* ---------- Header ---------- */
    .hero { margin-bottom: 24px; }
    .pill {
      display: inline-block; background: var(--accent-soft); color: var(--accent);
      font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
      padding: 4px 10px; border-radius: 999px; margin-bottom: 14px;
    }
    h1 { font-size: 1.7rem; letter-spacing: -0.03em; margin-bottom: 6px; }
    .sub { color: var(--text-muted); font-size: 0.95rem; max-width: 640px; }

    /* ---------- Card + controls ---------- */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35); margin-bottom: 20px;
    }
    .controls { display: flex; gap: 18px; align-items: flex-end; flex-wrap: wrap; }
    .field { display: flex; flex-direction: column; gap: 7px; font-size: 0.78rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }

    input[type="file"] {
      font-family: inherit; font-size: 0.83rem; color: var(--text);
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 9px; padding: 9px 11px; cursor: pointer; max-width: 280px;
    }
    input[type="file"]::file-selector-button {
      font-family: inherit; font-size: 0.8rem; font-weight: 600;
      background: var(--surface); color: var(--text); border: 1px solid var(--border2);
      border-radius: 7px; padding: 5px 11px; margin-right: 11px; cursor: pointer; transition: all 0.14s;
    }
    input[type="file"]::file-selector-button:hover { border-color: var(--accent); }

    .btn {
      background: var(--accent); color: #0a0c10; border: 1px solid var(--accent);
      border-radius: 9px; padding: 10px 18px; font-size: 0.85rem; font-weight: 600;
      font-family: inherit; cursor: pointer; transition: background 0.14s, border-color 0.14s;
    }
    .btn:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .btn:active { transform: translateY(1px); }

    #status {
      margin-top: 14px; font-size: 0.85rem; color: var(--text-muted);
      font-family: var(--mono);
    }
    #status.ok { color: var(--success); }

    /* ---------- Image + overlay ---------- */
    #container {
      position: relative; display: inline-block; max-width: 100%;
      border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
      background: var(--surface-2);
    }
    #container:empty { display: none; }
    #image { display: block; max-width: 100%; height: auto; }
    #image[src=""] { display: none; }

    .word-box {
      position: absolute;
      background: var(--highlight);
      border: 1px solid var(--highlight-border);
      pointer-events: none;
      box-sizing: border-box;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <span class="pill">OCR Viewer</span>
      <h1>hOCR Viewer</h1>
      <p class="sub">Load an image and its tesseract <code>.hocr</code> output to overlay a highlight box on every recognised word. Generate the hOCR with the bundled <code>ocr.sh</code> script.</p>
    </header>

    <div class="card">
      <div class="controls">
        <label class="field">Original image
          <input type="file" id="imgFile" accept="image/*">
        </label>
        <label class="field">hOCR file (.hocr)
          <input type="file" id="hocrFile" accept=".hocr,.html,.xml">
        </label>
        <button class="btn" id="renderBtn">Render highlights</button>
      </div>
      <div id="status">Load an image and an hOCR file, then click Render.</div>
    </div>

    <div id="container">
      <img id="image" src="" alt="">
    </div>
  </div>

  <script>
    const imgFileEl  = document.getElementById('imgFile');
    const hocrFileEl = document.getElementById('hocrFile');
    const renderBtn  = document.getElementById('renderBtn');
    const container  = document.getElementById('container');
    const imgEl      = document.getElementById('image');
    const statusEl   = document.getElementById('status');

    let imageReady = false;
    let hocrDoc    = null;

    function setStatus(text, ok) {
      statusEl.textContent = text;
      statusEl.classList.toggle('ok', !!ok);
    }

    imgFileEl.addEventListener('change', () => {
      const file = imgFileEl.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      imgEl.onload = () => { imageReady = true; };
      imgEl.src = url;
    });

    hocrFileEl.addEventListener('change', () => {
      const file = hocrFileEl.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        const parser = new DOMParser();
        hocrDoc = parser.parseFromString(e.target.result, 'text/html');
      };
      reader.readAsText(file);
    });

    renderBtn.addEventListener('click', render);

    function parseBbox(title) {
      if (!title) return null;
      const m = title.match(/bbox\s+(\d+)\s+(\d+)\s+(\d+)\s+(\d+)/);
      return m ? { x0: +m[1], y0: +m[2], x1: +m[3], y1: +m[4] } : null;
    }

    function render() {
      container.querySelectorAll('.word-box').forEach(el => el.remove());

      if (!imageReady) {
        setStatus('No image loaded — select an image file first.', false);
        return;
      }
      if (!hocrDoc) {
        setStatus('No hOCR loaded — select an .hocr file first.', false);
        return;
      }

      const scaleX = imgEl.clientWidth  / imgEl.naturalWidth;
      const scaleY = imgEl.clientHeight / imgEl.naturalHeight;

      const words = hocrDoc.querySelectorAll('.ocrx_word');
      let count = 0;
      words.forEach(word => {
        const bbox = parseBbox(word.getAttribute('title'));
        if (!bbox) return;
        const div = document.createElement('div');
        div.className = 'word-box';
        div.style.left   = (bbox.x0 * scaleX) + 'px';
        div.style.top    = (bbox.y0 * scaleY) + 'px';
        div.style.width  = ((bbox.x1 - bbox.x0) * scaleX) + 'px';
        div.style.height = ((bbox.y1 - bbox.y0) * scaleY) + 'px';
        div.title = word.textContent.trim();
        container.appendChild(div);
        count++;
      });

      if (count > 0) {
        setStatus(`Rendered ${count} word highlight${count === 1 ? '' : 's'}.`, true);
      } else {
        setStatus('No word elements found in hOCR (check the file is valid tesseract hOCR output).', false);
      }
    }
  </script>
</body>
</html>
