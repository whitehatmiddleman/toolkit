<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>hOCR Viewer</title>
<style>
  body { font-family: sans-serif; margin: 2em; background: #f5f5f5; }
  h1 { margin-bottom: 0.5em; }
  .controls { margin-bottom: 1.5em; display: flex; gap: 1.5em; align-items: center; flex-wrap: wrap; }
  .controls label { display: flex; flex-direction: column; font-size: 0.85em; color: #555; gap: 0.25em; }
  .controls input[type=file] { font-size: 0.9em; }
  button { padding: 0.4em 1.2em; font-size: 1em; cursor: pointer; }
  #status { font-size: 0.9em; color: #666; margin-top: 0.5em; }
  #container { position: relative; display: inline-block; border: 1px solid #ccc; background: #fff; }
  #image { display: block; max-width: 100%; height: auto; }
  .word-box {
    position: absolute;
    background: rgba(255, 220, 0, 0.35);
    border: 1px solid rgba(200, 150, 0, 0.7);
    pointer-events: none;
    box-sizing: border-box;
  }
</style>
</head>
<body>
<h1>hOCR Viewer</h1>
<div class="controls">
  <label>Original image
    <input type="file" id="imgFile" accept="image/*">
  </label>
  <label>hOCR file (.hocr)
    <input type="file" id="hocrFile" accept=".hocr,.html,.xml">
  </label>
  <button id="renderBtn">Render highlights</button>
</div>
<div id="status">Load an image and an hOCR file, then click Render.</div>
<br>
<div id="container">
  <img id="image" src="" alt="">
</div>

<script>
  const imgFileEl  = document.getElementById('imgFile');
  const hocrFileEl = document.getElementById('hocrFile');
  const renderBtn  = document.getElementById('renderBtn');
  const container  = document.getElementById('container');
  const imgEl      = document.getElementById('image');
  const statusEl   = document.getElementById('status');

  let imageReady = false;
  let hocrDoc    = null;

  imgFileEl.addEventListener('change', () => {
    const file = imgFileEl.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    imgEl.onload = () => { imageReady = true; };
    imgEl.src = url;
  });

  hocrFileEl.addEventListener('change', () => {
    const file = hocrFileEl.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      const parser = new DOMParser();
      hocrDoc = parser.parseFromString(e.target.result, 'text/html');
    };
    reader.readAsText(file);
  });

  renderBtn.addEventListener('click', render);

  function parseBbox(title) {
    if (!title) return null;
    const m = title.match(/bbox\s+(\d+)\s+(\d+)\s+(\d+)\s+(\d+)/);
    return m ? { x0: +m[1], y0: +m[2], x1: +m[3], y1: +m[4] } : null;
  }

  function render() {
    container.querySelectorAll('.word-box').forEach(el => el.remove());

    if (!imageReady) {
      statusEl.textContent = 'No image loaded — select an image file first.';
      return;
    }
    if (!hocrDoc) {
      statusEl.textContent = 'No hOCR loaded — select an .hocr file first.';
      return;
    }

    const scaleX = imgEl.clientWidth  / imgEl.naturalWidth;
    const scaleY = imgEl.clientHeight / imgEl.naturalHeight;

    const words = hocrDoc.querySelectorAll('.ocrx_word');
    let count = 0;
    words.forEach(word => {
      const bbox = parseBbox(word.getAttribute('title'));
      if (!bbox) return;
      const div = document.createElement('div');
      div.className = 'word-box';
      div.style.left   = (bbox.x0 * scaleX) + 'px';
      div.style.top    = (bbox.y0 * scaleY) + 'px';
      div.style.width  = ((bbox.x1 - bbox.x0) * scaleX) + 'px';
      div.style.height = ((bbox.y1 - bbox.y0) * scaleY) + 'px';
      div.title = word.textContent.trim();
      container.appendChild(div);
      count++;
    });

    statusEl.textContent = count > 0
      ? `Rendered ${count} word highlight${count === 1 ? '' : 's'}.`
      : 'No word elements found in hOCR (check the file is valid tesseract hOCR output).';
  }
</script>
</body>
</html>
